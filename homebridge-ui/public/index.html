<div class="sl-wrap" id="sl-root">
  <div class="sl-head">
    <div class="sl-logo"><img src="icon.png" alt=""><span class="sl-verified" aria-hidden="true">✓</span></div>
    <div><strong data-t="title"></strong><div class="sl-muted" data-t="subtitle"></div></div>
    <button class="btn btn-sm btn-outline-secondary sl-lang" id="sl-lang"></button>
  </div>
  <div class="sl-badges" id="sl-badges"></div>

  <div class="sl-card" id="sl-steps"></div>
  <div class="sl-card" id="sl-engine-card">
    <h6 data-t="engine"></h6>
    <select class="form-control sl-pick" id="sl-engine">
      <option value="" data-t="engineChoose"></option>
      <option value="python" data-t="enginePython"></option>
      <option value="javascript" data-t="engineJs"></option>
    </select>
    <div class="sl-muted mt-1" data-t="engineNote"></div>
    <div class="sl-pill sl-warn mt-1" id="sl-engine-need" data-t="engineNeed" style="display:none"></div>
  </div>
  <div class="sl-card" id="sl-runtime"></div>

  <div class="sl-card">
    <h6 data-t="addTitle"></h6>
    <div class="sl-muted" data-t="addIntro"></div>
    <div class="sl-way">
      <strong data-t="scanTitle"></strong>
      <div class="sl-muted" data-t="scanNote"></div>
      <button class="btn btn-primary mt-2" id="sl-scan-btn"></button>
      <div id="sl-scan" class="mt-2"></div>
    </div>
    <div class="sl-way">
      <strong data-t="manualTitle"></strong>
      <div class="sl-row mt-1">
        <input type="text" class="form-control" id="sl-host" placeholder="192.168.1.50 / AA:BB:CC:DD:EE:FF" dir="ltr">
        <button class="btn btn-primary" id="sl-discover" data-t="discover"></button>
      </div>
      <div id="sl-result" class="mt-2"></div>
      <div class="sl-muted mt-1" data-t="addHint"></div>
    </div>
  </div>

  <div class="sl-card">
    <h6 data-t="devicesTitle"></h6>
    <div id="sl-devices"></div>
  </div>

  <div class="sl-card">
    <h6 data-t="generalTitle"></h6>
    <div class="sl-row">
      <label class="mb-0" data-t="pollInterval"></label>
      <input type="number" class="form-control" id="sl-poll" min="4" max="300" style="max-width:110px" dir="ltr">
      <label class="mb-0"><input type="checkbox" id="sl-push"> <span data-t="push"></span></label>
    </div>
    <div class="sl-muted mt-1" data-t="pollNote"></div>
    <div class="sl-muted mt-1" id="sl-poll-floor" style="color:#b45309" hidden></div>
    <div class="sl-row mt-2">
      <label class="mb-0"><input type="checkbox" id="sl-follow"> <span data-t="follow"></span></label>
    </div>
    <div class="sl-muted" data-t="followNote"></div>

  </div>

  <div class="sl-card sl-danger">
    <h6 data-t="wipeTitle"></h6>
    <ul class="mb-2" id="sl-wipe-list"></ul>
    <div class="sl-row">
      <input type="text" class="form-control" id="sl-wipe-confirm" placeholder="DELETE" dir="ltr" style="max-width:160px">
      <button class="btn btn-danger" id="sl-wipe" data-t="wipeButton"></button>
    </div>
  </div>
</div>

  async function save(message = true) {

  function errorText(err) {

  async function downloadDiagnostics(target) {
    try {
      const dump = await homebridge.request('/diagnostics', target);
      const text = JSON.stringify(dump, null, 2);
      const name = `samsung-local-diagnostics-${String(dump.kind || 'appliance')}.json`;
      // Phones often block a file download started inside the settings frame,
      // so the text is also shown here with Share and Copy buttons.
      showDiagnostics(text, name);
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.download = name; a.click();
      } catch { /* the panel below still has the text */ }
    } catch (err) { homebridge.toast.error(errorText(err)); }
  }

  function showDiagnostics(text, name) {
    let box = $('sl-diag-panel');
    if (!box) {
      box = document.createElement('div');
      box.id = 'sl-diag-panel';
      box.className = 'sl-card';
      $('sl-result').closest('.sl-card').after(box);
    }
    const canShare = typeof navigator.share === 'function' && typeof File === 'function';
    box.innerHTML = `<h6>${t('diagTitle')}</h6><div class="sl-muted mb-2">${t('diagHelp')}</div>
      <div class="sl-row mb-2">
        ${canShare ? `<button class="btn btn-sm btn-primary" id="sl-diag-share">${t('diagShare')}</button>` : ''}
        <button class="btn btn-sm btn-outline-secondary" id="sl-diag-copy">${t('diagCopy')}</button>
      </div>
      <textarea class="form-control" id="sl-diag-text" readonly dir="ltr" rows="8" style="font-family:monospace;font-size:.75rem"></textarea>`;
    $('sl-diag-text').value = text;
    $('sl-diag-copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); } catch { $('sl-diag-text').select(); document.execCommand('copy'); }
      homebridge.toast.success(t('diagCopied'));
    });
    $('sl-diag-share')?.addEventListener('click', async () => {
      try {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); } else { await navigator.share({ title: name, text }); }
      } catch { /* cancelled */ }

  // --- every other appliance kind (air purifier, refrigerator, robot vacuum, …) ---
  const REPO = 'https://github.com/Abdulazizruh/homebridge-samsung-local';

  function partLabel(r) {

  /** A ready GitHub report for one function that does not work. Nothing is sent by the plugin itself. */
  function reportLink(d, r) {
    const title = `${d.kind}${d.model ? ` ${d.model}` : ''}: "${r.id}" does not work`;
    const body = ['**Appliance type:** ' + d.kind, '**Model:** ' + (d.model ?? 'unknown'), '**Function:** ' + r.id, '**Plugin version:** ' + (pluginVersion || 'unknown'), '',

    return `${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  const applianceDefaults = (d) => Object.fromEntries((d.features || []).map((r) => [r.id, r.default !== false]));

        <div class="mt-2"><strong>${t('cycleStyle')}</strong>

      <div class="sl-muted">${t('diagNote')}</div></div>`;
    if (d.unknownResources?.length) {
      more += `<details class="mt-2"><summary>${t('unknownRes')} (${d.unknownResources.length})</summary><div dir="ltr" class="sl-muted">${d.unknownResources.map(esc).join('<br>')}</div></details>`;
    }
    html += `<details class="mt-2" ${inline ? '' : 'open'}><summary>${t('reportsTitle')}</summary>${more}</details>`;
    box.innerHTML = html;
    $('sl-result-diag')?.addEventListener('click', () => downloadDiagnostics({ deviceId: p.deviceId, host: p.host }));
    $('sl-kb-send')?.addEventListener('click', async () => {
      const out = $('sl-kb-result'); const text = $('sl-kb-text').value;
      if (!text) { out.innerHTML = `<span class="sl-pill sl-warn">${t('kbEmpty')}</span>`; return; }
      out.innerHTML = `<span class="sl-muted">${t('kbSending')}</span>`;
      try {
        const r = await homebridge.request('/tv-text', { host: p.host, id: p.deviceId, text, done: $('sl-kb-done').checked });
        const said = r.keyboardBefore === true || r.keyboardAfter === true ? t('kbSaidOpen') : t('kbSaidNothing');
        out.innerHTML = `<span class="sl-pill sl-ok">${t('kbSent')}</span> <span class="sl-muted">${said}</span>`;
      } catch (err) { out.innerHTML = `<span class="sl-pill sl-bad">${esc(errorText(err))}</span>`; }
    });
    $('sl-tv-pair')?.addEventListener('click', async () => {
      const state = $('sl-tv-state'); const button = $('sl-tv-pair');
      button.disabled = true; state.className = 'sl-pill sl-warn'; state.textContent = t('tvPairing');
      try {
        await homebridge.request('/tv-pair', { host: p.host });
        tvPaired.add(p.deviceId);
        state.className = 'sl-pill sl-ok'; state.textContent = t('tvPaired');
        $('sl-add-tv').disabled = false;
      } catch (err) {
        state.className = 'sl-pill sl-bad'; state.textContent = errorText(err);
      } finally { button.disabled = false; }
    });
    $('sl-add-tv')?.addEventListener('click', async () => {
      const entry = { host: p.host, id: p.deviceId, type: 'tv', enabled: true,
        tvMode: $('sl-tv-tile')?.checked ? 'tile' : 'switches',
        tvSwitches: $('sl-tv-switches-on')?.checked ? [...box.querySelectorAll('[name="sl-tv-switch"]:checked')].map((x) => x.value) : [] };
      if (p.mac) { entry.mac = p.mac; }
      if (d.model) { entry.model = d.model; }
      entry.name = $('sl-name')?.value.trim() || existing?.name || p.tv.name || 'Samsung TV'; // a known TV is renamed in its card
      entry.appleRemote = Boolean($('sl-tv-apple')?.checked);
      if ($('sl-tv-pin')) {
        const pin = $('sl-tv-pin').value.trim();
        // A typing slip must not change the pairing: only an empty field goes back to 0000.
        if (pin && !/^\d{4}$/.test(pin)) {
          $('sl-tv-pin').classList.add('is-invalid'); $('sl-tv-pin').focus();
          homebridge.toast.warning(t('phPinBad'));
          return;
        }
        $('sl-tv-pin').classList.remove('is-invalid');
        if (pin) { entry.appleRemotePin = pin; } else { delete entry.appleRemotePin; }
      }
      if (entry.appleRemote && box.querySelector('[name="sl-tv-touch"]:checked:not(:disabled)')?.value === 'pointer') { entry.appleRemoteTouch = 'pointer'; } else { delete entry.appleRemoteTouch; }
      done();
      await change(() => {
        const i = config.devices.findIndex((x) => (x.id && x.id === p.deviceId) || (!x.id && x.host === p.host));
        if (i >= 0) {
          config.devices[i] = { ...config.devices[i], ...entry, enabled: config.devices[i].enabled !== false };
          // A code that was cleared in the field goes back to the default: the earlier one must not stay behind.
          if ($('sl-tv-pin') && !('appleRemotePin' in entry)) { delete config.devices[i].appleRemotePin; }
          if (!('appleRemoteTouch' in entry)) { delete config.devices[i].appleRemoteTouch; }
        } else { config.devices.push(entry); }
      });
    });
    $('sl-add')?.addEventListener('click', async () => {
      const features = {};
      box.querySelectorAll('[data-feat]').forEach((el) => { features[el.dataset.feat] = el.checked; });
      const entry = { host: p.host, id: p.deviceId, enabled: true, features };
      if (p.mac) { entry.mac = p.mac; }
      const name = $('sl-name').value.trim();
      if (name) { entry.name = name; }
      if ($('sl-cycle-style')) { entry.cycleStyle = $('sl-cycle-style').value; }
      done();
      await change(() => {
        const i = config.devices.findIndex((x) => (x.id && x.id === p.deviceId) || (!x.id && x.host === p.host));
        if (i >= 0) { config.devices[i] = { ...config.devices[i], ...entry, enabled: config.devices[i].enabled !== false }; } else { config.devices.push(entry); }
      });
    });
  }

  // ---- Automatic scan: runs only when its button is pressed, adds only what is ticked.
  let scan = null;
  const scanBusy = () => Boolean(scan) && (scan.phase === 'sweep' || scan.phase === 'reading');

  /** Decide what a read appliance is to this list: already here, ready, or not usable. */
  async function settleFound(item, p) {
    item.probe = p; item.host = p.host;
    const d = p.described;
    const known = config.devices.find((x) => x.id && x.id === p.deviceId);
    if (known) {
      // Same appliance on a new address: keep one entry and follow it, as the manual path does.
      if (known.host !== p.host) {
        await change(() => { const dev = config.devices.find((x) => x.id === p.deviceId); if (dev) { dev.host = p.host; } }, false);
        item.state = 'moved';
      } else { item.state = 'added'; }
    } else if (d.kind === 'tv') {
      const ready = p.tv?.paired || tvPaired.has(p.deviceId);
      item.state = ready ? 'ready' : 'pair'; item.checked = Boolean(ready);
    } else if (d.kind === 'airConditioner' || d.support === 'experimental' || d.support === 'supported') {
      item.state = 'ready'; item.checked = true;
    } else { item.state = 'unsupported'; }
  }

  async function readFound(item, run) {
    item.state = 'busy'; item.error = null; renderScan();
    try {
      const p = await homebridge.request('/probe', { host: item.host });
      if (scan !== run) { return; }
      await settleFound(item, p);
    } catch (err) {
      if (scan !== run) { return; }
      item.state = 'failed'; item.error = errorText(err);
    }
    renderScan();
  }

  async function startScan() {
    if (scanBusy()) { return; }
    const run = { phase: 'sweep', items: [], networks: [], at: 0, stop: false };
    scan = run; renderScan();
    try {
      const found = await homebridge.request('/scan');
      if (scan !== run) { return; }
      run.networks = found.networks ?? [];
      run.counts = { alive: found.alive, ocf: (found.appliances ?? []).length, tvs: (found.tvs ?? []).length };
      for (const tv of found.tvs ?? []) {
        const item = { host: tv.host, state: 'wait', checked: false };
        await settleFound(item, tv);
        run.items.push(item);
      }
      const mine = new Set(config.devices.filter((x) => x.type !== 'tv').map((x) => x.host));
      for (const host of found.appliances ?? []) {
        // An appliance already in the list is never read again here: it stays connected to the plugin.
        const dev = mine.has(host) ? config.devices.find((x) => x.type !== 'tv' && x.host === host) : null;
        run.items.push(dev ? { host, state: 'added', dev } : { host, state: 'wait', checked: false });
      }
      run.phase = 'reading';
      // One appliance at a time: a session is opened for each, and they are slow to answer two at once.
      const queue = run.items.filter((i) => i.state === 'wait');
      run.total = queue.length;
      for (const item of queue) {
        if (scan !== run || run.stop) { break; }
        run.at += 1;
        await readFound(item, run);
      }
      if (scan === run) { run.phase = 'done'; }
    } catch (err) {
      if (scan !== run) { return; }
      run.phase = 'done'; run.error = errorText(err);
    }
    renderScan();
  }

  function entryOf(p) {
    const d = p.described;
    if (d.kind === 'tv') {
      const entry = { host: p.host, id: p.deviceId, type: 'tv', enabled: true, tvMode: 'tile', name: p.tv?.name || 'Samsung TV' };
      if (p.mac) { entry.mac = p.mac; }
      if (d.model) { entry.model = d.model; }
      return entry;
    }
    const has = new Set((d.features || []).filter((r) => r.device === true).map((r) => r.id));
    const features = {};
    if (d.family === 'appliance') {
      Object.assign(features, applianceDefaults(d));
    } else if (d.kind === 'airConditioner') {
      for (const k of Object.keys(DEFAULTS)) { if (NEEDS[k].some((id) => has.has(id))) { features[k] = DEFAULTS[k]; } }
    } else {
      const needs = { progressTile: 'progress', kidsLockSensor: 'kidsLock', alertSensor: 'alarms', energyEve: 'energyKWh', stageSensors: 'stages', drumCleanSensor: 'drumClean' };
      for (const k of Object.keys(LAUNDRY_DEFAULTS)) { if (!needs[k] || has.has(needs[k])) { features[k] = LAUNDRY_DEFAULTS[k]; } }
    }
    const entry = { host: p.host, id: p.deviceId, enabled: true, features };
    if (p.mac) { entry.mac = p.mac; }
    return entry;
  }

  function renderScan() {
    const btn = $('sl-scan-btn'); const box = $('sl-scan');
    btn.disabled = !engineChosen() || scanBusy();
    btn.textContent = t(scan?.phase === 'done' ? 'scanAgain' : 'scanBtn');
    if (!scan) { box.innerHTML = ''; return; }
    if (scan.phase === 'sweep') { box.innerHTML = `<span class="sl-muted">${t('scanSweep')}</span>`; return; }
    if (scan.error) { box.innerHTML = `<div class="alert alert-danger mb-0">${esc(scan.error)}</div>`; return; }
    const run = scan;
    const pill = { ready: 'sl-ok', added: '', moved: 'sl-ok', just: 'sl-ok', wait: '', busy: 'sl-warn', failed: 'sl-bad', unsupported: 'sl-warn', pair: 'sl-warn' };
    const word = { ready: 'scanReady', added: 'scanAdded', moved: 'scanMoved', just: 'scanJust', wait: 'scanWait', busy: 'scanBusy', failed: 'scanFailed', unsupported: 'scanUnsupported', pair: 'scanPair' };
    const rows = run.items.map((item, i) => {
      const d = item.probe?.described;
      const kind = d ? (KINDS[lang][d.kind] ?? d.kind) : item.dev ? esc(item.dev.name || t('scanAdded')) : 'Samsung';
      const title = item.probe?.tv?.name ? `${esc(item.probe.tv.name)}` : '';
      const tick = item.state === 'ready' ? `<input type="checkbox" data-pick="${i}" ${item.checked ? 'checked' : ''} aria-label="${t('scanAdd')}">` : '';
      const act = item.state === 'pair' ? `<button class="btn btn-sm btn-primary" data-pair="${i}">${t('tvPair')}</button>`
        : (item.state === 'failed' || (item.state === 'wait' && run.phase === 'done')) ? `<button class="btn btn-sm btn-outline-secondary" data-read="${i}">${t('scanRetry')}</button>`
        : item.state === 'unsupported' ? `<button class="btn btn-sm btn-outline-secondary" data-diag="${i}">${t('diagFile')}</button>` : '';
      const off = item.state === 'pair' && item.probe?.tv && !item.probe.tv.power ? `<div class="sl-muted">${t('tvOff')}</div>` : '';
      return `<div class="sl-found">${tick}
        <div class="sl-grow"><strong>${kind}</strong> ${title ? `<span>${title}</span>` : ''}
          <div class="sl-muted" dir="ltr" style="text-align:start">${esc(d?.model ?? '')}${d?.model ? ' · ' : ''}${esc(item.host)}</div>
          ${item.error ? `<div class="sl-muted">${esc(item.error)}</div>` : ''}${off}</div>
        <span class="sl-pill ${pill[item.state]}">${t(word[item.state])}</span>${act}</div>`;
    }).join('');
    const picked = run.items.filter((i) => i.state === 'ready' && i.checked).length;
    const progress = run.phase === 'reading'
      ? `<div class="sl-row"><span class="sl-pill sl-warn">${t('scanReading')} <span dir="ltr">${run.at}</span> ${t('scanOf')} <span dir="ltr">${run.total}</span></span>
          <button class="btn btn-sm btn-outline-secondary" id="sl-scan-stop">${t('scanStop')}</button></div>` : '';
    const fresh = run.items.some((i) => !['added', 'moved'].includes(i.state));
    box.innerHTML = `${run.networks.length ? `<div class="sl-muted">${t('scanNet')}: <span dir="ltr">${run.networks.map(esc).join(' , ')}</span></div>` : ''}
      ${run.counts ? `<div class="sl-muted">${run.counts.alive === null || run.counts.alive === undefined ? '' : `${t('scanSeen')}: <span dir="ltr">${run.counts.alive}</span> · `}${t('scanAnswered')}: <span dir="ltr">${run.counts.ocf}</span> · ${t('scanTvs')}: <span dir="ltr">${run.counts.tvs}</span></div>` : ''}
      ${progress}${run.stop && run.phase === 'done' ? `<div class="sl-muted">${t('scanStopped')}</div>` : ''}${rows}
      ${run.phase === 'done' && !fresh ? `<div class="alert alert-info mt-2 mb-2">${t('scanNone')}</div>` : ''}
      ${run.note ? `<div class="alert alert-success mt-2 mb-2">${t(run.note)}</div>` : ''}
      <div class="sl-row mt-2">
        <button class="btn btn-success" id="sl-scan-add" ${picked && !scanBusy() ? '' : 'disabled'}>${t('scanAdd')} (<span dir="ltr">${picked}</span>)</button>
        ${run.phase === 'done' ? `<button class="btn btn-outline-secondary" id="sl-scan-close">${t('scanClose')}</button>` : ''}
      </div>`;
    box.querySelectorAll('[data-pick]').forEach((el) => el.addEventListener('change', () => { run.items[Number(el.dataset.pick)].checked = el.checked; renderScan(); }));
    box.querySelectorAll('[data-read]').forEach((el) => el.addEventListener('click', () => readFound(run.items[Number(el.dataset.read)], run)));
    box.querySelectorAll('[data-diag]').forEach((el) => el.addEventListener('click', () => { const it = run.items[Number(el.dataset.diag)]; downloadDiagnostics({ deviceId: it.probe.deviceId, host: it.host }); }));
    box.querySelectorAll('[data-pair]').forEach((el) => el.addEventListener('click', async () => {
      const item = run.items[Number(el.dataset.pair)];
      el.disabled = true; el.textContent = t('tvPairing');
      try {
        await homebridge.request('/tv-pair', { host: item.host });
        tvPaired.add(item.probe.deviceId);
        item.state = 'ready'; item.checked = true; item.error = null;
      } catch (err) { item.error = errorText(err); }
      renderScan();
    }));
    $('sl-scan-stop')?.addEventListener('click', () => { run.stop = true; });
    $('sl-scan-close')?.addEventListener('click', () => { scan = null; renderScan(); });
    $('sl-scan-add')?.addEventListener('click', async () => {
      const picks = run.items.filter((i) => i.state === 'ready' && i.checked);
      if (!picks.length) { return; }
      await change(() => {
        for (const item of picks) {
          const p = item.probe;
          if (!config.devices.some((x) => (x.id && x.id === p.deviceId) || (!x.id && x.host === p.host))) { config.devices.push(entryOf(p)); }
        }
      }, false);
      for (const item of picks) { item.state = 'just'; item.checked = false; }
      run.note = 'scanDone';
      homebridge.toast.success(t('saved'));
      await refreshStatus();
    });
  }

  /** The Home app code of a TV tile: a picture to scan and the digits under it. */
  function tvSetupBox(dev) {
    if (dev.type !== 'tv' || dev.tvMode === 'switches') { return ''; }
    const setup = status.tvSetup?.[dev.id];
    if (!setup) { return `<div class="sl-muted">${t('tvCodeLater')}</div>`; }
    const code = `<div class="sl-tvcode">${setup.svg ? `<div class="sl-qr" dir="ltr">${setup.svg}</div>` : ''}
      <div class="sl-pin" dir="ltr">${esc(setup.pin)}</div>
      <div class="sl-muted">${t(setup.paired ? 'tvCodePairedNote' : 'tvCodeNote')}</div></div>`;
    // Once the TV is in Apple Home the code is rarely needed: one tap away, out of the way.
    return setup.paired
      ? `<details class="mt-1"><summary><span class="sl-muted">${t('tvCodeShow')}</span></summary>${code}</details>`
      : `<div class="mt-1">${code}</div>`; // whether it is in Apple Home is shown beside the tile's name
  }

  // --- the device list, grouped by kind of appliance ---
  const SECTIONS = ['ac', 'laundry', 'tv', 'air', 'fridge', 'vacuum', 'cooking', 'other'];
  const SECTION_OF = { airConditioner: 'ac', washer: 'laundry', dryer: 'laundry', dishwasher: 'laundry', tv: 'tv', airPurifier: 'air', dehumidifier: 'air',
    refrigerator: 'fridge', robotVacuum: 'vacuum', oven: 'cooking', range: 'cooking', microwave: 'cooking', cooktop: 'cooking', hood: 'cooking' };
  function sectionOf(dev, snap) {
    if (dev.type === 'tv') { return 'tv'; }
    const kind = snap?.described?.kind;
    // An appliance not seen yet is taken for an air conditioner, as the plugin itself does.
    return kind ? (SECTION_OF[kind] ?? 'other') : 'ac';
  }
  function foldedSections() {
    try { const v = JSON.parse(localStorage.getItem('sl-folded') || '{}'); return v && typeof v === 'object' ? v : {}; } catch { return {}; }
  }
  /** A change inside open options that is not saved yet: say so, with a way back and a way to save. Nothing is redrawn, so what is typed stays. */
  function markDirty(e) {
    if (!openKey || dirty === openKey || !e.target.closest?.('#sl-inline')) { return; }
    dirty = openKey;
    const name = config.devices.find((x) => keyOf(x) === dirty)?.name || '';
    const bar = document.createElement('div');
    bar.className = 'sl-dirty'; bar.setAttribute('role', 'status');
    bar.innerHTML = `${ICON.edit}<span>${t('dirtyNote')} <strong>${esc(name)}</strong></span>
      <button type="button" class="btn btn-sm btn-outline-dark" data-dirty="undo">${t('dirtyUndo')}</button>
      <button type="button" class="btn btn-sm btn-dark" data-dirty="save">${t('dirtySave')}</button>`;
    bar.querySelector('[data-dirty="undo"]').addEventListener('click', () => render());
    bar.querySelector('[data-dirty="save"]').addEventListener('click', () => ($('sl-add') || $('sl-add-tv'))?.click());
    $('sl-devices').appendChild(bar);
  }

  function renderDevices() {
    const box = $('sl-devices');
    if (!config.devices.length) { box.innerHTML = `<span class="sl-muted">${t('none')}</span>`; return; }
    const cards = config.devices.map((dev, i) => {
      const key = keyOf(dev);
      const snap = status.devices.find((s) => s.deviceId && s.deviceId === dev.id) || status.devices.find((s) => s.host === dev.host);
      // A TV: whether it allows this plugin (its answer to "Allow"), the base of everything else, beside its name.
      const allowed = dev.type === 'tv' ? status.tvAllowed?.[dev.id] : undefined;
      const state = dev.type === 'tv' ? `<span class="sl-pill ${allowed === true ? 'sl-ok' : allowed === false ? 'sl-bad' : ''}">${esc(KINDS[lang].tv)}${allowed === true ? ` · ${t('tvAllows')}` : allowed === false ? ` · ${t('tvRefused')}` : ''}</span>` : !snap ? `<span class="sl-pill">${t('unknownState')}</span>` : snap.online ? `<span class="sl-pill sl-ok">${t('online')}</span>` : `<span class="sl-pill sl-bad">${t('offline')}</span>`;
      const energy = snap?.described?.features?.filter((r) => ['powerWatts', 'energyKWh'].includes(r.id) && r.device === true)
        .map((r) => `${esc(T[lang].f[r.id])}: <span dir="ltr">${esc(r.value ?? '—')}</span>`).join(' · ') ?? '';
      const moved = snap?.deviceId && snap.deviceId === dev.id && snap.host && snap.host !== dev.host;
      const address = `${esc(moved ? snap.host : dev.host)}${snap?.mac || dev.mac ? ` · ${esc(snap?.mac || dev.mac)}` : ''}`;
      const shown = dev.name || snap?.described?.model || '—';
      const open = openKey === key;
      const shownOpen = open || renaming === key || expanded.has(key);
      const watts = snap?.described?.features?.find((r) => r.id === 'powerWatts' && r.device === true)?.value;
      const title = renaming === key
        ? `<input type="text" class="form-control sl-grow" id="sl-rename" value="${esc(dev.name ?? '')}" placeholder="${esc(shown)}" aria-label="${t('rename')}">
           <button class="btn btn-sm btn-success sl-mini" data-rn-save="${i}" aria-label="${t('saveName')}" title="${t('saveName')}">${ICON.check}</button>
           <button class="btn btn-sm btn-outline-secondary sl-mini" data-rn-cancel="${i}" aria-label="${t('cancel')}" title="${t('cancel')}">${ICON.close}</button>`
        : `<strong class="sl-grow">${esc(shown)}</strong>
           ${shownOpen ? `<button class="btn btn-sm btn-outline-secondary sl-mini" data-rn="${i}" aria-label="${t('rename')}" title="${t('rename')}">${ICON.edit}</button>` : ''}
           ${!shownOpen && Number(watts) > 0 ? `<span class="sl-muted" dir="ltr">${esc(watts)} W</span>` : ''}
           ${dev.enabled === false ? `<span class="sl-pill">${t('devOff')}</span>` : ''}${state}`;
      // Only the arrow at the row's edge opens or closes it: the rest of the row is safe to scroll over.
      const arrow = `<button type="button" class="btn btn-sm btn-outline-secondary sl-exp" data-exp="${i}" aria-expanded="${shownOpen}" aria-label="${t('devMore')}" title="${t('devMore')}">${shownOpen ? ICON.down : ICON.next}</button>`;
      const html = `<div class="sl-dev${shownOpen ? ' sl-open' : ''}"><div class="sl-dev-head">${title}${arrow}</div>
        ${shownOpen ? `<div class="sl-muted" dir="ltr" style="text-align:start">${address}</div>
        ${moved ? `<div class="sl-pill sl-ok">${t('followed')} <span dir="ltr">${esc(dev.host)} → ${esc(snap.host)}</span></div>` : ''}<div class="sl-muted">${energy}</div>${snap?.commandMs != null ? `<div class="sl-muted">${t('commandMs')}: <span dir="ltr">${snap.commandMs} ms</span> · ${snap.engine === 'javascript' ? 'JavaScript' : 'Python'}</div>` : ''}${snap?.readMs != null ? `<div class="sl-muted">${t('readMs')}: <span dir="ltr">${snap.readMs} ms</span> · ${snap.pushes > 0 ? t('pushOn') : t('pushOff')}</div>` : ''}
        <div class="sl-acts">
          <button class="btn btn-sm ${open ? 'btn-primary' : 'btn-outline-primary'}" data-cfg="${i}" aria-expanded="${open}">${ICON.gear}<span>${t('options')}</span></button>
          <button class="btn btn-sm btn-outline-secondary" data-ip="${i}">${ICON.address}<span>${t('changeIp')}</span></button>
          <button class="btn btn-sm btn-outline-secondary" data-diag="${i}" ${snap?.described || dev.type === 'tv' ? '' : 'disabled'}>${ICON.download}<span>${t('diagnostics')}</span></button>
        </div>
        <div class="sl-foot"><label class="sl-muted"><input type="checkbox" data-en="${i}" ${dev.enabled === false ? '' : 'checked'}> ${t('enabled')}</label>
          <button class="btn btn-sm btn-outline-danger sl-rm" data-rm="${i}">${ICON.trash}<span>${t('remove')}</span></button></div>` : ''}
        ${open ? '<div class="sl-inline" id="sl-inline"></div>' : ''}</div>`;
      return { html, section: sectionOf(dev, snap), online: dev.type === 'tv' ? null : Boolean(snap?.online), busy: open || renaming === key };
    });
    // One group per kind of appliance, in a fixed order; a group exists only while it has a device.
    const folded = foldedSections();
    box.innerHTML = SECTIONS.map((sec) => {
      const mine = cards.filter((c) => c.section === sec);
      if (!mine.length) { return ''; }
      // A group folded by the owner opens again when a device joins or leaves it, and while one of its devices is being edited.
      const shut = folded[sec] === mine.length && !mine.some((c) => c.busy);
      const known = mine.filter((c) => c.online !== null);
      const up = known.filter((c) => c.online).length;
      const link = !known.length ? '' : up === known.length ? (known.length === 1 ? T[lang].secOne : T[lang].secAll) : T[lang].secSome(up, known.length);
      return `<div class="sl-sec"><button type="button" class="sl-sec-head" data-sec="${sec}" data-count="${mine.length}" aria-expanded="${!shut}" title="${t('secFold')}">
          ${shut ? ICON.down : ICON.up}<span>${esc(T[lang].sec[sec])}</span><small>${esc(T[lang].secCount(mine.length))}${link ? ` · ${esc(link)}` : ''}</small></button>
        ${shut ? '' : `<div class="sl-sec-body">${mine.map((c) => c.html).join('')}</div>`}</div>`;
    }).join('');
    dirty = null; // drawing the list again draws the options from what is saved
    box.querySelectorAll('[data-exp]').forEach((b) => b.addEventListener('click', () => {
      const key = keyOf(config.devices[Number(b.dataset.exp)]);
      if (b.getAttribute('aria-expanded') === 'true') {
        expanded.delete(key);
        if (openKey === key) { openKey = null; lastProbe = null; dirty = null; }
        if (renaming === key) { renaming = null; }
      } else {
        expanded.add(key);
      }
      render();
    }));
    box.querySelectorAll('[data-sec]').forEach((b) => b.addEventListener('click', () => {
      const now = foldedSections();
      if (b.getAttribute('aria-expanded') === 'true') { now[b.dataset.sec] = Number(b.dataset.count); } else { delete now[b.dataset.sec]; }
      try { localStorage.setItem('sl-folded', JSON.stringify(now)); } catch { /* the choice lasts for this visit only */ }
      if (openKey && cards.find((c) => c.busy)?.section === b.dataset.sec) { openKey = null; lastProbe = null; }
      renderDevices();
    }));
    const saveName = async (i) => {
      const key = keyOf(config.devices[i]);
      const name = $('sl-rename').value.trim();
      renaming = null;
      if (!name || name === config.devices[i].name) { render(); return; }
      await change(() => { const dev = config.devices.find((x) => keyOf(x) === key); if (dev) { dev.name = name; } });
    };
    box.querySelectorAll('[data-rn]').forEach((b) => b.addEventListener('click', () => {
      renaming = keyOf(config.devices[Number(b.dataset.rn)]);
      render();
      $('sl-rename')?.focus(); $('sl-rename')?.select();
    }));
    box.querySelectorAll('[data-rn-save]').forEach((b) => b.addEventListener('click', () => saveName(Number(b.dataset.rnSave))));
    box.querySelectorAll('[data-rn-cancel]').forEach((b) => b.addEventListener('click', () => { renaming = null; render(); }));
    $('sl-rename')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { saveName(config.devices.findIndex((x) => keyOf(x) === renaming)); }
      if (e.key === 'Escape') { renaming = null; render(); }
    });
    box.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', async () => {
      // Two presses: the first asks, the second (within a few seconds) removes.
      if (b.dataset.armed !== '1') {
        b.dataset.armed = '1';
        b.className = 'btn btn-sm btn-danger sl-rm';
        b.querySelector('span').textContent = t('removeConfirm');
        setTimeout(() => {
          if (b.isConnected && b.dataset.armed === '1') {
            b.dataset.armed = ''; b.className = 'btn btn-sm btn-outline-danger sl-rm'; b.querySelector('span').textContent = t('remove');
          }
        }, 5000);
        return;
      }
      const key = keyOf(config.devices[Number(b.dataset.rm)]);
      await change(() => { config.devices = config.devices.filter((x) => keyOf(x) !== key); });
    }));
    box.querySelectorAll('[data-en]').forEach((b) => b.addEventListener('change', async () => {
      const key = keyOf(config.devices[Number(b.dataset.en)]);
      await change(() => { const dev = config.devices.find((x) => keyOf(x) === key); if (dev) { dev.enabled = b.checked; } });
    }));
    box.querySelectorAll('[data-cfg]').forEach((b) => b.addEventListener('click', () => {
      const dev = config.devices[Number(b.dataset.cfg)];
      const snap = status.devices.find((x) => x.deviceId && x.deviceId === dev.id) || status.devices.find((x) => x.host === dev.host);
      if (openKey === keyOf(dev)) {
        openKey = null; lastProbe = null; render();
        return;
      }
      // Every kind of appliance opens its options under its own row.
      openKey = keyOf(dev);
      expanded.add(openKey);
      dirty = null;
      if (snap?.described) {
        // Known appliance: no new discovery is needed.
        lastProbe = { ...snap, host: dev.host, deviceId: dev.id ?? snap.deviceId, source: 'snapshot' };
        render();
      } else if (dev.type === 'tv' && dev.id) {
        // A TV keeps no readings; what is in the settings is enough to show its options.
        lastProbe = {
          host: dev.host, deviceId: dev.id, mac: dev.mac ?? null, source: 'snapshot',
          described: { kind: 'tv', deviceId: dev.id, model: dev.model ?? null, support: 'supported', reason: null, features: [], unknownResources: [] },
          tv: { name: dev.name ?? null, power: true, paired: true, configured: true },
        };
        render();
      } else {
        // Never read before: ask the appliance now, and show the answer here.
        lastProbe = null;
        render();
        const here = $('sl-inline');
        if (here) { here.innerHTML = `<span class="sl-muted">${t('discovering')}</span>`; }
        homebridge.showSpinner();
        homebridge.request('/probe', { host: dev.host }).then((found) => {
          if (openKey !== keyOf(dev)) { return; }
          lastProbe = found; render();
        }).catch((err) => {
          if (openKey === keyOf(dev) && $('sl-inline')) { $('sl-inline').innerHTML = `<div class="alert alert-danger mb-0">${esc(errorText(err))}</div>`; }
        }).finally(() => homebridge.hideSpinner());
      }
      $('sl-inline')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }));
    box.querySelectorAll('[data-ip]').forEach((b) => b.addEventListener('click', () => {
      $('sl-host').value = config.devices[Number(b.dataset.ip)].host;
      $('sl-host').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('sl-host').focus({ preventScroll: true });
    }));
    box.querySelectorAll('[data-diag]').forEach((b) => b.addEventListener('click', () => {
      const dev = config.devices[Number(b.dataset.diag)];
      downloadDiagnostics({ deviceId: dev.id, host: dev.host });
    }));
  }

  // A short checklist that shows what is done and what to do next.
  // A new installation must pick its engine knowingly; one that already has appliances keeps the engine it runs on.
  const engineChosen = () => Boolean(config.engine) || config.devices.length > 0;
  function renderBadges() {
    const mine = config.devices.filter((d) => d.type !== 'tv' && d.enabled !== false);
    const connected = mine.filter((d) => (status.devices.find((x) => x.deviceId && x.deviceId === d.id) || status.devices.find((x) => x.host === d.host))?.online).length;
    const pills = [`<span class="sl-pill sl-ok">✓ ${t('badgeVerified')}</span>`];
    pluginVersion = status.version || '';
    if (status.version) { pills.push(`<span class="sl-pill">${t('badgeVersion')} <span dir="ltr">${esc(status.version)}</span></span>`); }
    if (engineChosen() && status.engine) { pills.push(`<span class="sl-pill">${t('badgeEngine')}: ${status.engine === 'javascript' ? 'JavaScript' : 'Python'}</span>`); }
    if (mine.length) { pills.push(`<span class="sl-pill ${connected === mine.length ? 'sl-ok' : 'sl-warn'}"><span dir="ltr">${connected}</span> ${t('badgeOf')} <span dir="ltr">${mine.length}</span> ${t('badgeConnected')}</span>`); }
    $('sl-badges').innerHTML = pills.join('');
  }
  function renderSteps() {
    const done = [engineChosen() && Boolean(status.runtimeReady), config.devices.length > 0, Boolean(config._bridge)];
    const next = done.indexOf(false);
    const steps = [1, 2, 3, 4].map((n, i) => {
      const isDone = i < 3 && done[i];
      const isNow = i === next || (i === 3 && next === -1);
      const tag = isDone ? `<span class="sl-pill sl-ok">${t('stepDone')}</span>` : isNow && i < 3 ? `<span class="sl-pill sl-warn">${t('stepNow')}</span>` : '';
      return `<div class="sl-step ${isDone ? 'done' : ''} ${isNow ? 'now' : ''}"><div class="sl-num">${isDone ? '✓' : n}</div>
        <div><div class="sl-step-title">${t('step' + n)} ${tag}</div><div class="sl-step-text sl-muted">${t('step' + n + 'Text')}</div></div></div>`;
    }).join('');
    const body = `${steps}<div class="sl-muted mt-1">${t('stepsOrder')}</div>`;
    // Once everything detectable is done the guide folds away, still one tap from view.
    $('sl-steps').innerHTML = next === -1
      ? `<details><summary><strong>${t('stepsDone')}</strong> <span class="sl-pill sl-ok">✓</span></summary><div class="mt-2">${body}</div></details>`
      : `<h6>${t('stepsTitle')}</h6>${body}`;
  }

  function renderRuntime() {
    const box = $('sl-runtime');
    const py = status.python ? `${t('pythonFound')}: <span dir="ltr">${esc(status.python.version)} · ${esc(status.arch)}</span>` : `${t('pythonProblem')}: ${esc(T[lang]['err_' + status.pythonError?.code] ?? status.pythonError?.message ?? '')}`;
    const chosen = engineChosen();
    $('sl-engine-need').style.display = chosen ? 'none' : '';
    $('sl-discover').disabled = !chosen;
    box.style.display = chosen ? '' : 'none';
    box.innerHTML = !chosen ? '' : status.engine === 'javascript'
      ? `<span class="sl-pill sl-ok">${t('engineJsReady')}</span>${status.pythonRuntimeMb > 0
        ? `<div class="sl-muted mt-1">${t('pyLeft')} <span dir="ltr">${status.pythonRuntimeMb} MB</span>. ${t('pyLeftNote')}</div>
           <button class="btn btn-sm btn-outline-danger mt-1" id="sl-py-remove">${t('pyRemove')}</button>` : ''}`
      : status.runtimeReady
      ? `<span class="sl-pill sl-ok">${t('runtimeReady')}</span> <span class="sl-muted">${py}</span>`
      : `<span class="sl-pill sl-warn">${t('runtimeMissing')}</span> <span class="sl-muted">${py}</span>
         <div class="sl-muted mt-1">${t('runtimeNote')}</div>
         <button class="btn btn-sm btn-primary mt-1" id="sl-prepare" ${status.python ? '' : 'disabled'}>${t('runtimePrepare')}</button>`;
    $('sl-py-remove')?.addEventListener('click', async () => {
      homebridge.showSpinner();
      try { const r = await homebridge.request('/remove-runtime'); homebridge.toast.success(`${t('pyRemoved')} ${r.freedMb} MB`); await refreshStatus(); } catch (err) { homebridge.toast.error(errorText(err)); } finally { homebridge.hideSpinner(); }
    });
    $('sl-prepare')?.addEventListener('click', async () => {
      homebridge.showSpinner(); box.querySelector('.sl-muted.mt-1').textContent = t('runtimePreparing');
      try { await homebridge.request('/prepare'); await refreshStatus(); } catch (err) { homebridge.toast.error(errorText(err)); } finally { homebridge.hideSpinner(); }
    });
  }

  function render() {
    const root = $('sl-root');
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    root.lang = lang;
    root.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('sl-lang').textContent = t('langButton');
    $('sl-wipe-list').innerHTML = ['wipe1', 'wipe2', 'wipe3'].map((k) => `<li>${t(k)}</li>`).join('');
    renderBadges();
    renderSteps();
    // A value saved below the minimum (older versions allowed 2) is shown as 4 and stored with the next save.
    const savedPoll = Number(config.pollInterval);
    const below = Number.isFinite(savedPoll) && savedPoll > 0 && savedPoll < 4;
    if (below) { config.pollInterval = 4; }
    $('sl-poll').value = config.pollInterval ?? 5;
    if (below || pollWasBelow) { pollWasBelow ??= savedPoll; $('sl-poll-floor').textContent = t('pollFloor').replace('{v}', pollWasBelow); }
    $('sl-poll-floor').hidden = !(below || pollWasBelow);
    $('sl-push').checked = config.pushUpdates !== false;
    $('sl-follow').checked = config.followAddress !== false;
    $('sl-engine').value = config.engine ?? (config.devices.length ? (status.engine ?? 'python') : '');
    renderRuntime(); renderDevices(); renderResult(); renderScan();
  }

  $('sl-devices').addEventListener('input', markDirty);
  $('sl-devices').addEventListener('change', markDirty);

  async function refreshStatus() {
    try { status = await homebridge.request('/status'); } catch { /* keep the previous status */ }
    render();
  }

  $('sl-lang').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('sl-lang', lang); render(); });
  $('sl-poll').addEventListener('change', async (e) => { const v = Math.min(300, Math.max(4, Number(e.target.value) || 5)); e.target.value = v; pollWasBelow = null; await change(() => { config.pollInterval = v; }, false); render(); });
  $('sl-engine').addEventListener('change', async (e) => { const v = e.target.value; if (!v) { return; } await change(() => { config.engine = v; }, false); await refreshStatus(); });
  $('sl-follow').addEventListener('change', async (e) => { const v = e.target.checked; await change(() => { config.followAddress = v; }, false); });
  $('sl-push').addEventListener('change', async (e) => { const v = e.target.checked; await change(() => { config.pushUpdates = v; }, false); });
  $('sl-scan-btn').addEventListener('click', startScan);
  $('sl-discover').addEventListener('click', async () => {
    const host = $('sl-host').value.trim();
    if (!host) { return; }
    if (openKey) { openKey = null; lastProbe = null; renderDevices(); }
    homebridge.showSpinner(); $('sl-result').innerHTML = `<span class="sl-muted">${t('discovering')}</span>`;
    try {
      lastProbe = await homebridge.request('/probe', { host });
      // Same appliance on a new address: keep one entry, never a duplicate.
      const moved = config.devices.find((x) => x.id && x.id === lastProbe.deviceId && x.host !== lastProbe.host);
      if (moved) {
        await change(() => { const dev = config.devices.find((x) => x.id === lastProbe.deviceId); if (dev) { dev.host = lastProbe.host; } }, false);
        homebridge.toast.info(t('sameDevice'));
      }
      await refreshStatus();
    } catch (err) {
      lastProbe = null;
      const tech = err?.error?.technical;
      const code = err?.error?.code ?? err?.code ?? 'error';
      const techHtml = `<details class="mt-2" open><summary>${t('techDetails')}</summary><pre dir="ltr" style="white-space:pre-wrap;font-size:.78rem;margin:6px 0 0">${esc(JSON.stringify({ code, ...(tech || { raw: err?.message }) }, null, 1))}</pre></details>`;
      $('sl-result').innerHTML = `<div class="alert alert-danger mb-0">${esc(errorText(err))}${techHtml}</div>`;
    } finally { homebridge.hideSpinner(); }
  });
  $('sl-wipe').addEventListener('click', async () => {
    if ($('sl-wipe-confirm').value.trim() !== 'DELETE') { homebridge.toast.warning(t('wipeType')); return; }
    try {
      const res = await homebridge.request('/wipe', { confirm: 'DELETE' });
      homebridge.toast.success(res.removed.length ? t('wipeDone') + res.removed.join(', ') : t('wipeNothing'));
      $('sl-wipe-confirm').value = ''; lastProbe = null; await refreshStatus();
    } catch (err) { homebridge.toast.error(errorText(err)); }
  });

  try { legacyNames = (await homebridge.request('/legacy-devices')).names; } catch { legacyNames = []; }
  await refreshStatus();
})();
</script>
