  // ---- Automatic scan: runs only when its button is pressed, adds only what is ticked.
  // The result stays on the page: a later scan adds to it and never clears what was found.
  let scan = null;
  const BUSY = ['connect', 'import', 'sweep', 'reading', 'match'];
  const scanBusy = () => Boolean(scan) && (BUSY.includes(scan.phase) || Boolean(scan.seek?.busy));
  const newRun = () => ({ phase: 'idle', items: [], networks: [], at: 0, total: 0, stop: false, seq: 0, pass: 0, auto: 0, startedAt: Date.now(), known: [], stOnly: [], stAway: [], stMissing: [] });
  const itemOf = (run, uid) => run.items.find((x) => x.uid === Number(uid));
  const addItem = (run, item) => { run.seq += 1; item.uid = run.seq; if (run.pass > 1 || run.seek) { item.fresh = true; } run.items.push(item); return item; };
  const clock = (ms) => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

  /** Decide what a read appliance is to this list: already here, ready, or not usable. */
  async function settleFound(item, p) {
    item.probe = p; item.host = p.host;
    const d = p.described;
    const known = config.devices.find((x) => x.id && x.id === p.deviceId);
    if (known) {
      item.dev = known;
      // Same appliance on a new address: keep one entry and follow it, as the manual path does.
      if (known.host !== p.host) {
        await change(() => { const dev = config.devices.find((x) => x.id === p.deviceId); if (dev) { dev.host = p.host; } }, false);
        item.state = 'moved';
      } else { item.state = 'added'; }
    } else if (d.kind === 'tv') {
      const ready = p.tv?.paired || tvPaired.has(p.deviceId);
      item.state = ready ? 'ready' : 'pair'; item.checked = Boolean(ready);
    } else if (d.kind === 'airConditioner' || d.support === 'experimental' || d.support === 'supported') {
      item.state = 'ready'; item.checked = true;
    } else { item.state = 'unsupported'; }
  }

  /** One appliance, one line: an appliance read again on a new address takes the place of its earlier line. */
  function dedupe(run, item) {
    const id = item.probe?.deviceId;
    const old = id ? run.items.find((x) => x !== item && (x.probe?.deviceId === id || x.dev?.id === id)) : null;
    if (!old) { return; }
    for (const k of ['name', 'typed', 'sug', 'stPick', 'useSt']) { if (old[k] !== undefined && item[k] === undefined) { item[k] = old[k]; } }
    if (old.state === 'ready' && item.state === 'ready') { item.checked = old.checked; }
    run.items.splice(run.items.indexOf(old), 1);
  }

  async function readFound(item, run, tries = 2) {
    item.error = null;
    for (let n = 1; n <= tries; n += 1) {
      item.state = 'busy'; renderScan();
      try {
        const p = await homebridge.request('/probe', { host: item.host });
        if (scan !== run) { return; }
        await settleFound(item, p); dedupe(run, item); item.error = null; item.seenAt = Date.now();
        break;
      } catch (err) {
        if (scan !== run) { return; }
        item.state = 'failed'; item.error = errorText(err);
        if (run.stop) { break; }
      }
    }
    await stMatch(run);
    renderScan();
  }

  /** Put what a look across the network found into the result: new lines are added, known ones stay. */
  async function mergeFound(run, found, { whole = true } = {}) {
    const now = Date.now();
    const seen = new Set();
    if (whole) {
      run.networks = found.networks ?? run.networks;
      run.counts = { alive: found.alive, ocf: (found.appliances ?? []).length, tvs: (found.tvs ?? []).length };
    }
    for (const tv of found.tvs ?? []) {
      let item = tv.deviceId ? run.items.find((x) => (x.probe?.deviceId ?? x.dev?.id) === tv.deviceId) : null;
      item ??= run.items.find((x) => x.host === tv.host) ?? addItem(run, { host: tv.host, state: 'wait', checked: false });
      const before = { state: item.state, checked: item.checked };
      await settleFound(item, tv);
      if (before.state === 'ready' && item.state === 'ready') { item.checked = before.checked; } // the owner's tick stays
      item.gone = false; item.seenAt = now; seen.add(item);
    }
    for (const host of found.appliances ?? []) {
      let item = run.items.find((x) => x.host === host);
      if (!item) {
        // An appliance already in the list is never read again here: it stays connected to the plugin.
        const dev = config.devices.find((x) => x.type !== 'tv' && x.host === host);
        item = addItem(run, dev ? { host, state: 'added', dev } : { host, state: 'wait', checked: false });
      } else if (item.state === 'failed') { item.state = 'wait'; }
      item.gone = false; item.seenAt = now; seen.add(item);
    }
    // Found before and silent now: it stays, with its match; only its line says so.
    if (whole) { for (const item of run.items) { if (!seen.has(item) && !['wait', 'failed', 'busy'].includes(item.state)) { item.gone = true; } } }
  }

  /** One look across the network, then a read of each new appliance, one at a time. */
  async function sweepAndRead(run, { whole = true } = {}) {
    run.phase = 'sweep'; run.phaseAt = Date.now(); renderScan();
    const found = await homebridge.request('/scan', {});
    if (scan !== run) { return false; }
    await mergeFound(run, found, { whole });
    await stMatch(run);
    run.phase = 'reading';
    // One appliance at a time: a session is opened for each, and they are slow to answer two at once.
    const queue = run.items.filter((i) => i.state === 'wait');
    run.at = 0; run.total = queue.length; renderScan();
    for (const item of queue) {
      if (scan !== run || run.stop) { break; }
      run.at += 1;
      await readFound(item, run);
    }
    return scan === run;
  }

  async function startScan() {
    if (scanBusy()) { return; }
    const run = scan ?? newRun();
    scan = run;
    run.stop = false; run.error = null; run.note = null; run.seek = null; run.pass += 1; run.auto = 0; run.startedAt = Date.now();
    for (const it of run.items) { it.fresh = false; }
    startTicker();
    try {
      if (!(await sweepAndRead(run))) { return; }
      // A second look by itself when SmartThings shows an appliance of this home online and it did not answer here.
      if (!run.stop && stImport && run.stMissing.some((si) => stImport.devices[si].online === true)) {
        run.auto = 1;
        if (!(await sweepAndRead(run, { whole: false }))) { return; }
      }
      if (stImport) { run.phase = 'match'; renderScan(); await stMatch(run); }
      run.phase = 'done';
    } catch (err) {
      if (scan !== run) { return; }
      run.phase = 'done'; run.error = errorText(err);
    }
    renderScan();
  }

  /**
   * Look for one SmartThings appliance only: the rest of the result stays as it is, and it stops as soon
   * as the appliance is found. As a watch, it looks for every missing one for a few minutes, so an
   * appliance switched on meanwhile shows up by itself.
   */
  async function seekOne(si, watch = false) {
    const run = scan;
    if (!run || scanBusy() || !stImport || (!watch && !stImport.devices[si])) { return; }
    const kind = watch ? null : stImport.devices[si].kind;
    const missing = () => (watch ? run.stMissing.length > 0 : run.stOnly.includes(si));
    run.stop = false;
    run.seek = { si: watch ? null : si, watch, attempt: 0, max: watch ? 20 : 3, busy: true, failed: false, error: null };
    for (const it of run.items) { it.fresh = false; }
    startTicker();
    try {
      for (let n = 1; n <= run.seek.max && !run.stop; n += 1) {
        run.seek.attempt = n; run.seek.at = Date.now(); renderScan();
        const found = await homebridge.request('/scan', { only: kind === 'tv' ? 'tv' : kind ? 'ocf' : null });
        if (scan !== run) { return; }
        await mergeFound(run, found, { whole: false });
        await stMatch(run);
        for (const item of run.items.filter((i) => i.state === 'wait')) {
          if (!missing() || run.stop) { break; }
          await readFound(item, run, 1);
          if (scan !== run) { return; }
        }
        if (!missing()) { break; }
        // A pause before the next look; "Stop" ends it at once.
        for (let w = 0; w < (watch ? 20 : 3) && n < run.seek.max && !run.stop; w += 1) { await new Promise((resolve) => setTimeout(resolve, 500)); }
      }
    } catch (err) { run.seek.error = errorText(err); }
    if (scan !== run) { return; }
    run.seek.busy = false; run.seek.failed = !watch && !run.stop && run.stOnly.includes(si);
    if (!run.seek.failed && !run.seek.error) { run.seek = null; }
    run.stop = false;
    renderScan();
  }

  function entryOf(p) {
    const d = p.described;
    if (d.kind === 'tv') {
      const entry = { host: p.host, id: p.deviceId, type: 'tv', enabled: true, tvMode: 'tile', name: p.tv?.name || 'Samsung TV' };
      if (p.mac) { entry.mac = p.mac; }
      if (d.model) { entry.model = d.model; }
      return entry;
    }
    const has = new Set((d.features || []).filter((r) => r.device === true).map((r) => r.id));
    const features = {};
    if (d.family === 'appliance') {
      Object.assign(features, applianceDefaults(d));
    } else if (d.kind === 'airConditioner') {
      for (const k of Object.keys(DEFAULTS)) { if (NEEDS[k].some((id) => has.has(id))) { features[k] = DEFAULTS[k]; } }
    } else {
      const needs = { progressTile: 'progress', kidsLockSensor: 'kidsLock', alertSensor: 'alarms', energyEve: 'energyKWh', stageSensors: 'stages', drumCleanSensor: 'drumClean' };
      for (const k of Object.keys(LAUNDRY_DEFAULTS)) { if (!needs[k] || has.has(needs[k])) { features[k] = LAUNDRY_DEFAULTS[k]; } }
    }
    const entry = { host: p.host, id: p.deviceId, enabled: true, features };
    if (p.mac) { entry.mac = p.mac; }
    return entry;
  }

  /** Match the SmartThings list to what was found; done after every change, so each line is in its group at once. */
  async function stMatch(run) {
    if (!stImport) {
      for (const it of run.items) { it.m = null; }
      run.known = []; run.stOnly = []; run.stAway = []; run.stMissing = []; run.matched = false;
      return;
    }
    const items = [...run.items];
    const locals = items.map((it) => ({
      deviceId: it.probe?.deviceId ?? it.dev?.id ?? null, model: it.probe?.described?.model ?? it.dev?.model ?? null,
      name: it.dev?.name ?? null, pick: it.stPick,
    }));
    // Appliances already in the list that did not answer (a TV in standby): matched too, so they are not offered again.
    const seen = new Set(locals.map((l) => l.deviceId).filter(Boolean));
    const known = config.devices.filter((x) => x.id && !seen.has(x.id));
    for (const dev of known) { locals.push({ deviceId: dev.id, model: dev.model ?? null, name: dev.name ?? null }); }
    let res;
    try { res = await homebridge.request('/smartthings-match', { devices: stImport.devices, locals }); } catch { return; }
    if (!stImport) { return; }
    items.forEach((it, i) => { const m = res.locals[i]; it.m = m && m.st !== null ? m : null; });
    run.known = known.map((dev, k) => ({ dev, m: res.locals[items.length + k] })).filter(({ m }) => m && m.st !== null);
    run.stOnly = res.stOnly ?? [];
    // The place most matched appliances are in is this home; appliances in another place (an office) are not expected here.
    const count = new Map();
    for (const m of res.locals) { const pl = m && m.st !== null ? stImport.devices[m.st].place : null; if (pl) { count.set(pl, (count.get(pl) ?? 0) + 1); } }
    const home = res.home ?? [...count.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
    run.stAway = home ? run.stOnly.filter((si) => stImport.devices[si].place && stImport.devices[si].place !== home) : [];
    // Set aside by the owner: off the list of missing ones. Found on the network, it shows like any other appliance.
    run.stIgnored = run.stOnly.filter((si) => !run.stAway.includes(si) && stImport.devices[si].ignored);
    run.stMissing = run.stOnly.filter((si) => !run.stAway.includes(si) && !stImport.devices[si].ignored);
    run.matched = true;
  }

  async function stImportNow() {
    if (scanBusy()) { return; }
    const field = $('sl-st-token');
    const token = field.value.trim();
    field.value = ''; // gone from the page at once
    if (!token) { field.focus(); return; }
    const box = $('sl-st-result');
    box.innerHTML = '';
    const run = scan ?? newRun();
    scan = run;
    run.error = null; run.stProg = null; run.seek = null; run.phase = 'connect'; run.startedAt = Date.now(); run.phaseAt = Date.now();
    startTicker(); renderScan();
    $('sl-scan').scrollIntoView({ block: 'nearest' });
    // How far the import is, asked from the plugin's own server while it reads.
    const poll = setInterval(async () => {
      try {
        const p = await homebridge.request('/smartthings-progress');
        if (!['connect', 'import'].includes(run.phase)) { return; }
        run.stProg = p;
        if (p?.stage === 'import') { run.phase = 'import'; }
      } catch { /* the bar keeps its last state */ }
    }, 500);
    try {
      stImport = await homebridge.request('/smartthings-import', { token });
    } catch (err) {
      clearInterval(poll);
      run.phase = run.items.length ? 'done' : 'idle';
      if (!run.items.length) { scan = null; }
      box.innerHTML = `<div class="alert alert-danger mb-0">${esc(errorText(err))}</div>`;
      renderScan();
      return;
    }
    clearInterval(poll);
    renderStBox();
    run.phase = 'idle';
    await startScan();
  }

  function renderStBox() {
    const box = $('sl-st-result');
    if (!box) { return; }
    if (!stImport) { if (!box.querySelector('.alert-danger')) { box.innerHTML = ''; } return; }
    const all = stImport.devices.length;
    const local = stImport.devices.filter((d) => d.local).length;
    box.innerHTML = `<div class="alert alert-success mb-1">${t('stDone').replace('{all}', `<span dir="ltr">${all}</span>`).replace('{local}', `<span dir="ltr">${local}</span>`)}</div>
      ${stImport.statusRead ? '' : `<div class="sl-muted">${t('stNoStatus')}</div>`}
      ${stImport.roomsRead ? '' : `<div class="sl-muted">${t('stNoRooms')}</div>`}
      <div class="sl-muted">${t('stKept').replace('{d}', `<span dir="ltr">${new Date(stImport.savedAt ?? Date.now()).toISOString().slice(0, 10)}</span>`)}</div>
      <button class="btn btn-sm btn-outline-secondary mt-1" id="sl-st-forget">${t('stForget')}</button>`;
    $('sl-st-forget').addEventListener('click', async () => {
      if (scanBusy()) { return; }
      stImport = null; renderStBox();
      try { await homebridge.request('/smartthings-forget'); } catch { /* nothing was kept */ }
      if (scan) { for (const it of scan.items) { delete it.stPick; delete it.useSt; } scan.seek = null; await stMatch(scan); }
      renderScan();
    });
  }

  // ---- The progress bar: its stages, and where the work is now. Redrawn twice a second while something runs.
  let ticker = null;
  function startTicker() {
    if (ticker) { return; }
    ticker = setInterval(() => {
      if (!scanBusy()) { clearInterval(ticker); ticker = null; }
      renderProgress();
    }, 500);
  }
  const elapsed = (from) => { const s = Math.max(0, Math.round((Date.now() - from) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function progressHtml(run) {
    if (!BUSY.includes(run.phase)) { return ''; }
    const withSt = Boolean(stImport) || ['connect', 'import'].includes(run.phase);
    const stages = withSt ? ['pgConnect', 'pgImport', 'pgScan', 'pgMatch'] : ['pgScan', 'pgRead'];
    const since = (Date.now() - (run.phaseAt ?? run.startedAt)) / 1000;
    const reading = run.total ? Math.min(1, (run.at - 0.5) / run.total) : 1;
    let cur; let part; let detail;
    if (run.phase === 'connect') { cur = 0; part = Math.min(0.9, since / 4); detail = t('pgConnectD'); }
    else if (run.phase === 'import') {
      cur = 1; const p = run.stProg ?? {};
      part = p.total ? Math.min(1, p.done / p.total) : 0.1;
      detail = p.total ? t('pgImportD').replace('{a}', `<span dir="ltr">${p.done}</span>`).replace('{b}', `<span dir="ltr">${p.total}</span>`) : t('pgImportD0');
    } else if (run.phase === 'sweep') { cur = withSt ? 2 : 0; part = Math.min(0.95, since / 15) * (withSt ? 0.5 : 1); detail = t('scanSweep'); }
    else if (run.phase === 'reading') {
      cur = withSt ? 2 : 1; part = withSt ? 0.5 + reading * 0.5 : reading;
      detail = run.total ? `${t('scanReading')} <span dir="ltr">${run.at}</span> ${t('scanOf')} <span dir="ltr">${run.total}</span>` : t('pgNoNew');
    } else { cur = stages.length - 1; part = 0.5; detail = t('pgMatchD'); }
    const pct = Math.round(((cur + part) / stages.length) * 100);
    const chips = stages.map((k, i) => `<span class="${i < cur ? 'sl-pg-done' : i === cur ? 'sl-pg-now' : ''}"><span dir="ltr">${i + 1}</span> · ${t(k)}${i < cur ? ' ✓' : ''}</span>`).join('');
    return `<div class="sl-pg" role="status"><div class="sl-pg-head"><span class="sl-spin"></span> <strong>${detail}</strong> <span class="sl-muted" dir="ltr">${elapsed(run.startedAt)}</span></div>
      <div class="sl-pg-bar"><div style="width:${pct}%"></div></div>
      <div class="sl-pg-steps">${chips}</div>
      <div class="sl-row mt-1">${run.auto ? `<span class="sl-muted">${t('pgAuto')}</span>` : ''}
        ${['sweep', 'reading'].includes(run.phase) && !run.stop ? `<button class="btn btn-sm btn-outline-secondary" data-stop>${t('scanStop')}</button>` : ''}
        ${run.stop ? `<span class="sl-muted">${t('pgStopping')}</span>` : ''}</div></div>`;
  }

  function seekHtml(run) {
    const s = run.seek;
    if (!s?.busy) { return ''; }
    const pct = Math.round(((s.attempt - 1 + Math.min(0.95, (Date.now() - s.at) / 12000)) / s.max) * 100);
    const text = t(s.watch ? 'stWatching' : 'stSeeking').replace('{a}', `<span dir="ltr">${s.attempt}</span>`).replace('{b}', `<span dir="ltr">${s.max}</span>`);
    return `<div class="sl-pg mt-1" role="status"><span class="sl-spin"></span> ${text}
      <div class="sl-pg-bar"><div style="width:${pct}%"></div></div>
      <div class="sl-row"><span class="sl-muted sl-grow">${t(s.watch ? 'stWatchNote' : 'stSeekNote')}</span>
        ${run.stop ? `<span class="sl-muted">${t('pgStopping')}</span>` : `<button class="btn btn-sm btn-outline-secondary" data-stop>${t('scanStop')}</button>`}</div></div>`;
  }

  function renderProgress() {
    const set = (id, html) => { const el = $(id); if (el && el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; } };
    set('sl-scan-prog', scan ? progressHtml(scan) : '');
    set('sl-seek-prog', scan ? seekHtml(scan) : '');
    const btn = $('sl-scan-btn');
    if (btn) { btn.disabled = !engineChosen() || scanBusy(); }
    // The import button is pressed by the owner, then greyed with its own wheel until the work is over.
    const go = $('sl-st-go');
    if (go) {
      const busy = scanBusy();
      const html = busy ? `<span class="sl-spin sl-spin-s"></span> ${t('stGoBusy')}` : t('stGo');
      go.disabled = busy; go.classList.toggle('btn-secondary', busy); go.classList.toggle('btn-primary', !busy);
      if (go.dataset.html !== html) { go.innerHTML = html; go.dataset.html = html; }
    }
  }

  /** A SmartThings appliance that did not answer on the network: looked for on its own, with what to check. */
  function stOnlyRow(run, si) {
    const d = stImport.devices[si];
    const s = run.seek && !run.seek.watch && run.seek.si === si ? run.seek : null;
    const about = [KINDS[lang][d.kind] ?? '', d.model ? `<span dir="ltr">${esc(d.model)}</span>` : '', d.room ? esc(d.room) : ''].filter(Boolean).join(' · ');
    const seen = d.lastSeen ? ` · ${t('stLastSeen')} <span dir="ltr">${esc(String(d.lastSeen).slice(0, 10))}</span>` : '';
    const there = d.online === false ? `${t('stOffline')}${seen}` : d.online ? t('stOnline') : '';
    const busy = scanBusy();
    return `<div class="sl-found"><div class="sl-grow"><strong>${esc(d.name)}</strong>
      <span class="sl-pill sl-bad">${s?.failed ? t('stSeekFail').replace('{b}', `<span dir="ltr">${s.max}</span>`) : t('stNoAnswer')}</span>
      ${about ? `<div class="sl-muted">${about}</div>` : ''}${there ? `<div class="sl-muted">${there}</div>` : ''}
      ${s?.error ? `<div class="sl-muted">${esc(s.error)}</div>` : ''}
      ${s?.busy ? '<div id="sl-seek-prog"></div>' : `<div class="sl-row mt-2"><button class="btn btn-sm btn-primary" data-seek="${si}" ${busy ? 'disabled' : ''}>${t(s?.failed ? 'stSeekAgain' : 'stSeek')}</button>
        <button class="btn btn-sm btn-outline-secondary" data-st-hand>${t('stByHand')}</button>
        <button class="btn btn-sm btn-outline-secondary" data-ignore="${si}" ${busy ? 'disabled' : ''}>${t('stIgnore')}</button></div>
      <details class="sl-whybox" ${s?.failed ? 'open' : ''}><summary>${t('stWhy')}</summary><ul class="sl-why">${['stWhy1', 'stWhy2', 'stWhy3', 'stWhy4', 'stWhy5'].map((k) => `<li>${t(k)}</li>`).join('')}</ul></details>`}</div></div>`;
  }

  function renderScan() {
    const btn = $('sl-scan-btn'); const box = $('sl-scan');
    btn.disabled = !engineChosen() || scanBusy();
    btn.textContent = t(scan && scan.pass > 0 ? 'scanAgain' : 'scanBtn');
    if (!scan) { box.innerHTML = ''; renderProgress(); return; }
    const run = scan;
    const busy = scanBusy();
    // The name being typed keeps its place and its cursor when the list is drawn again.
    const act = document.activeElement;
    const typing = act?.dataset?.name ? { uid: act.dataset.name, a: act.selectionStart, b: act.selectionEnd } : null;
    const pill = { ready: 'sl-ok', added: '', moved: 'sl-ok', just: 'sl-ok', wait: '', busy: 'sl-warn', failed: 'sl-bad', unsupported: 'sl-warn', pair: 'sl-warn' };
    const word = { ready: 'scanReady', added: 'scanAdded', moved: 'scanMoved', just: 'scanJust', wait: 'scanWait', busy: 'scanBusy', failed: 'scanFailed', unsupported: 'scanUnsupported', pair: 'scanPair' };
    const isNew = (item) => !['added', 'moved', 'just'].includes(item.state);
    const stDevOf = (item) => (item.m && stImport ? stImport.devices[item.m.st] : null);
    const differs = (item) => { const st = stDevOf(item); return Boolean(st && item.dev?.name && st.name && st.name.trim().toLowerCase() !== item.dev.name.trim().toLowerCase()); };
    const rowOf = (item) => {
      const d = item.probe?.described;
      const stDev = stDevOf(item);
      const fresh = item.fresh ? ` <span class="sl-pill sl-fresh">${t('scanFresh')}</span>` : '';
      const gone = item.gone ? `<div class="sl-muted">${t('scanGoneNote').replace('{t}', `<span dir="ltr">${clock(item.seenAt ?? Date.now())}</span>`)}</div>` : '';
      const status = item.state === 'busy' ? `<span class="sl-pill sl-warn"><span class="sl-spin sl-spin-s"></span> ${t('scanBusy')}</span>`
        : item.gone ? `<span class="sl-pill sl-warn">${t('scanGone')}</span>` : `<span class="sl-pill ${pill[item.state]}">${t(word[item.state])}</span>`;
      const where = `<div class="sl-muted" dir="ltr" style="text-align:start">${esc(d?.model ?? item.dev?.model ?? '')}${d?.model ?? item.dev?.model ? ' · ' : ''}${esc(item.host)}</div>`;
      if (!isNew(item)) {
        // An appliance already in the list is shown by the name it has here, TVs included.
        const use = differs(item)
          ? `<label class="sl-use mt-1"><input type="checkbox" data-use="${item.uid}" ${item.useSt ? 'checked' : ''} ${busy ? 'disabled' : ''}> <span>${t('stUse')} <strong>${esc(stDev.name)}</strong></span></label>`
          : stDev ? `<div class="mt-1"><span class="sl-pill sl-src-st">${t('stThere')} ${esc(stDev.name)}</span> <span class="sl-pill sl-ok">${t('stHow_' + item.m.how)}</span></div>` : '';
        return `<div class="sl-found ${item.fresh ? 'sl-found-fresh' : ''}"><div class="sl-grow"><strong>${esc(item.dev?.name || t('scanAdded'))}</strong>${fresh}${use}${where}${gone}</div>${status}</div>`;
      }
      const kind = d ? (KINDS[lang][d.kind] ?? d.kind) : 'Samsung';
      const tick = item.state === 'ready' ? `<input type="checkbox" data-pick="${item.uid}" ${item.checked ? 'checked' : ''} aria-label="${t('scanAdd')}">` : '';
      const named = ['ready', 'pair'].includes(item.state);
      if (named && !item.typed) {
        // Offered again while nothing is typed: a SmartThings name can arrive after the scan.
        const sug = suggestName(item.probe, run.items.filter((x) => x !== item && x.sug).map((x) => x.sug.name), stDev ? { dev: stDev, how: item.m.how } : null);
        if (!item.sug || item.sug.name !== sug.name || item.sug.src !== sug.src || item.sug.how !== sug.how) { item.sug = sug; item.name = sug.name; }
      }
      // With a SmartThings import, an appliance without a match can take a name from the list.
      const pickable = run.matched && named && (!stDev || item.m.how === 'pick');
      const choices = pickable ? [...(item.m?.how === 'pick' ? [item.m.st] : []), ...run.stOnly] : [];
      const pickList = pickable && choices.length
        ? `<select class="form-select form-select-sm mt-1" data-st-pick="${item.uid}"><option value="">${t('stPick')}</option>${choices.map((si) => `<option value="${si}" ${item.m?.how === 'pick' && item.m.st === si ? 'selected' : ''}>${esc(stImport.devices[si].name)}${stImport.devices[si].room ? ` · ${esc(stImport.devices[si].room)}` : ''}</option>`).join('')}</select>` : '';
      const naming = named
        ? `<div class="sl-row mt-1">${nameSource(item.sug)} ${nowState(d)}</div>${pickList}
           <input type="text" class="form-control form-control-sm mt-1" data-name="${item.uid}" value="${esc(item.name ?? '')}" aria-label="${t('name')}">` : '';
      const act2 = item.state === 'pair' ? `<button class="btn btn-sm btn-primary" data-pair="${item.uid}">${t('tvPair')}</button>`
        : (item.state === 'failed' || (item.state === 'wait' && !busy)) ? `<button class="btn btn-sm btn-outline-secondary" data-read="${item.uid}" ${busy ? 'disabled' : ''}>${t('scanRetry')}</button>`
        : item.state === 'unsupported' ? `<button class="btn btn-sm btn-outline-secondary" data-diag="${item.uid}">${t('diagFile')}</button>` : '';
      const off = item.state === 'pair' && item.probe?.tv && !item.probe.tv.power ? `<div class="sl-muted">${t('tvOff')}</div>` : '';
      return `<div class="sl-found ${item.fresh ? 'sl-found-fresh' : ''}">${tick}
        <div class="sl-grow"><strong>${kind}</strong>${fresh}${naming}${where}
          ${item.error ? `<div class="sl-muted">${esc(item.error)}</div>` : ''}${off}${gone}</div>${status}${act2}</div>`;
    };
    const group = (key, list) => (list.length ? `<div class="sl-stgroup">${t(key)} (<span dir="ltr">${list.length}</span>)</div>${list.join('')}` : '');
    const fresh = run.items.filter(isNew);
    const mine = run.items.filter((x) => !isNew(x));
    let rows;
    if (run.matched && stImport) {
      const cloud = stImport.devices.filter((x) => !x.local);
      const silent = run.known.map(({ dev, m }) => `<div class="sl-found"><div class="sl-grow"><strong>${esc(dev.name)}</strong>
        <div class="mt-1"><span class="sl-pill sl-src-st">${t('stThere')} ${esc(stImport.devices[m.st].name)}</span> <span class="sl-pill sl-ok">${t('stHow_' + m.how)}</span></div></div>
        <span class="sl-pill sl-warn">${t('scanGone')}</span></div>`);
      const same = [...mine.filter((x) => !differs(x)).map(rowOf), ...silent];
      rows = `${group('stNew', fresh.map(rowOf))}
        ${group('stDiff', mine.filter(differs).map(rowOf))}
        ${same.length ? `<details class="sl-same" ${run.openSame ? 'open' : ''}><summary class="sl-stgroup">${t('stSame')} (<span dir="ltr">${same.length}</span>)</summary>${same.join('')}</details>` : ''}
        ${run.stMissing.length ? `<div class="sl-stgroup">${t('stStOnly')} (<span dir="ltr">${run.stMissing.length}</span>)</div>

        ${cloud.length ? `<details class="mt-2"><summary class="sl-muted">${t('stCloud').replace('{n}', `<span dir="ltr">${cloud.length}</span>`)}</summary><div class="sl-muted">${cloud.map((x) => esc(x.name)).join('، ')}</div></details>` : ''}`;
    } else { rows = run.items.map(rowOf).join(''); }
    const picked = run.items.filter((i) => i.state === 'ready' && i.checked).length;

    box.innerHTML = `<div id="sl-scan-prog"></div>

      ${run.networks.length ? `<div class="sl-muted">${t('scanNet')}: <span dir="ltr">${run.networks.map(esc).join(' , ')}</span></div>` : ''}
      ${run.counts ? `<div class="sl-muted">${run.counts.alive === null || run.counts.alive === undefined ? '' : `${t('scanSeen')}: <span dir="ltr">${run.counts.alive}</span> · `}${t('scanAnswered')}: <span dir="ltr">${run.counts.ocf}</span> · ${t('scanTvs')}: <span dir="ltr">${run.counts.tvs}</span></div>` : ''}

      ${run.phase === 'done' && !fresh.length && !stImport ? `<div class="alert alert-info mt-2 mb-2">${t('scanNone')}</div>` : ''}
      ${run.note ? `<div class="alert alert-success mt-2 mb-2">${t(run.note)}</div>` : ''}
      ${swept ? `<div class="sl-row sl-decide mt-2">
        <button class="btn btn-success" id="sl-scan-add" ${(picked || renames) && !busy ? '' : 'disabled'}>${t(mine.some(differs) ? 'stApply' : 'scanAdd')} (<span dir="ltr">${picked + renames}</span>)</button>
        ${pickable > 1 ? `<button class="btn btn-sm btn-outline-secondary" id="sl-sel-all" ${busy ? 'disabled' : ''}>${t('selAll')}</button><button class="btn btn-sm btn-outline-secondary" id="sl-sel-none" ${busy ? 'disabled' : ''}>${t('selNone')}</button>` : ''}
        ${busy ? '' : `<button class="btn btn-outline-secondary" id="sl-scan-close">${t('scanClose')}</button>`}

    renderProgress();
    if (typing) { const el = box.querySelector(`[data-name="${typing.uid}"]`); if (el) { el.focus(); try { el.setSelectionRange(typing.a, typing.b); } catch { /* not a text field */ } } }
    box.querySelectorAll('[data-pick]').forEach((el) => el.addEventListener('change', () => { itemOf(run, el.dataset.pick).checked = el.checked; renderScan(); }));
    box.querySelectorAll('[data-use]').forEach((el) => el.addEventListener('change', () => { itemOf(run, el.dataset.use).useSt = el.checked; renderScan(); }));
    box.querySelectorAll('[data-name]').forEach((el) => el.addEventListener('input', () => { const it = itemOf(run, el.dataset.name); it.name = el.value; it.typed = true; }));
    box.querySelectorAll('[data-st-pick]').forEach((el) => el.addEventListener('change', async () => {
      const it = itemOf(run, el.dataset.stPick);

    box.querySelectorAll('[data-unignore]').forEach((el) => el.addEventListener('click', () => setIgnored(Number(el.dataset.unignore), false)));
    $('sl-watch')?.addEventListener('click', () => seekOne(null, true));
    box.querySelectorAll('[data-seek]').forEach((el) => el.addEventListener('click', () => seekOne(Number(el.dataset.seek))));
    box.querySelectorAll('[data-st-hand]').forEach((el) => el.addEventListener('click', () => { $('sl-host').scrollIntoView({ block: 'center' }); $('sl-host').focus(); }));
    box.querySelectorAll('[data-read]').forEach((el) => el.addEventListener('click', () => { if (!scanBusy()) { readFound(itemOf(run, el.dataset.read), run, 1); } }));

    box.querySelectorAll('[data-pair]').forEach((el) => el.addEventListener('click', async () => {

    const tickAll = (on) => { for (const i of run.items) { if (i.state === 'ready') { i.checked = on; } else if (!isNew(i) && differs(i)) { i.useSt = on; } } renderScan(); };

      await change(() => {
        for (const item of picks) {
          const p = item.probe;
          let entry = config.devices.find((x) => (x.id && x.id === p.deviceId) || (!x.id && x.host === p.host));
          if (!entry) {
            entry = entryOf(p);
            const name = String(item.name ?? '').trim();
            if (name) { entry.name = name; } // as typed in the list; a TV keeps its own name when left empty

  /** The Home app code of a TV tile: a picture to scan and the digits under it. */
  function tvSetupBox(dev) {
    if (dev.type !== 'tv' || dev.tvMode === 'switches') { return ''; }

    if (!setup) { return `<div class="sl-muted">${t('tvCodeLater')}</div>`; }
    const code = `<div class="sl-tvcode">${setup.svg ? `<div class="sl-qr" dir="ltr">${setup.svg}</div>` : ''}

      <div class="sl-muted">${t(setup.paired ? 'tvCodePairedNote' : 'tvCodeNote')}</div></div>`;
    // Once the TV is in Apple Home the code is rarely needed: one tap away, out of the way.
    return setup.paired
      ? `<details class="mt-1"><summary><span class="sl-muted">${t('tvCodeShow')}</span></summary>${code}</details>`
      : `<div class="mt-1">${code}</div>`; // whether it is in Apple Home is shown beside the tile's name
  }

  // --- the device list, grouped by kind of appliance ---
  const SECTIONS = ['ac', 'laundry', 'tv', 'air', 'fridge', 'vacuum', 'cooking', 'other'];
  const SECTION_OF = { airConditioner: 'ac', washer: 'laundry', dryer: 'laundry', dishwasher: 'laundry', tv: 'tv', airPurifier: 'air', dehumidifier: 'air',
    refrigerator: 'fridge', robotVacuum: 'vacuum', oven: 'cooking', range: 'cooking', microwave: 'cooking', cooktop: 'cooking', hood: 'cooking' };
  function sectionOf(dev, snap) {
    if (dev.type === 'tv') { return 'tv'; }
    const kind = snap?.described?.kind;
    // An appliance not seen yet is taken for an air conditioner, as the plugin itself does.
    return kind ? (SECTION_OF[kind] ?? 'other') : 'ac';
  }
  function foldedSections() {

  }
  /** A change inside open options that is not saved yet: say so, with a way back and a way to save. Nothing is redrawn, so what is typed stays. */
  function markDirty(e) {
    if (!openKey || dirty === openKey || !e.target.closest?.('#sl-inline')) { return; }
    dirty = openKey;
    const name = config.devices.find((x) => keyOf(x) === dirty)?.name || '';
    const bar = document.createElement('div');
    bar.className = 'sl-dirty'; bar.setAttribute('role', 'status');
    bar.innerHTML = `${ICON.edit}<span>${t('dirtyNote')} <strong>${esc(name)}</strong></span>
      <button type="button" class="btn btn-sm btn-outline-dark" data-dirty="undo">${t('dirtyUndo')}</button>
      <button type="button" class="btn btn-sm btn-dark" data-dirty="save">${t('dirtySave')}</button>`;
    bar.querySelector('[data-dirty="undo"]').addEventListener('click', () => render());
    bar.querySelector('[data-dirty="save"]').addEventListener('click', () => ($('sl-add') || $('sl-add-tv'))?.click());

  function renderDevices() {
    const box = $('sl-devices');

    const cards = config.devices.map((dev, i) => {
      const key = keyOf(dev);
      const snap = status.devices.find((s) => s.deviceId && s.deviceId === dev.id) || status.devices.find((s) => s.host === dev.host);
      // A TV: whether it allows this plugin (its answer to "Allow"), the base of everything else, beside its name.
      const allowed = dev.type === 'tv' ? status.tvAllowed?.[dev.id] : undefined;
      const state = dev.type === 'tv' ? `<span class="sl-pill sl-link ${allowed === true ? 'sl-ok' : allowed === false ? 'sl-bad' : ''}">${allowed === null || allowed === undefined ? '' : ICON.bridgeLink}${allowed === true ? t('tvAllows') : allowed === false ? t('tvRefused') : esc(KINDS[lang].tv)}</span>` : !snap ? `<span class="sl-pill">${t('unknownState')}</span>` : snap.online ? `<span class="sl-pill sl-ok">${t('online')}</span>` : `<span class="sl-pill sl-bad">${t('offline')}</span>`;
      const energy = snap?.described?.features?.filter((r) => ['powerWatts', 'energyKWh'].includes(r.id) && r.device === true)
        .map((r) => `${esc(T[lang].f[r.id])}: <span dir="ltr">${esc(r.value ?? '—')}</span>`).join(' · ') ?? '';
      const moved = snap?.deviceId && snap.deviceId === dev.id && snap.host && snap.host !== dev.host;
      const address = `${esc(moved ? snap.host : dev.host)}${snap?.mac || dev.mac ? ` · ${esc(snap?.mac || dev.mac)}` : ''}`;
      const shown = dev.name || snap?.described?.model || '—';
      const open = openKey === key;
      const shownOpen = open || renaming === key || expanded.has(key);
      const watts = snap?.described?.features?.find((r) => r.id === 'powerWatts' && r.device === true)?.value;
      const title = renaming === key
        ? `<input type="text" class="form-control sl-grow" id="sl-rename" value="${esc(dev.name ?? '')}" placeholder="${esc(shown)}" aria-label="${t('rename')}">
           <button class="btn btn-sm btn-success sl-mini" data-rn-save="${i}" aria-label="${t('saveName')}" title="${t('saveName')}">${ICON.check}</button>
           <button class="btn btn-sm btn-outline-secondary sl-mini" data-rn-cancel="${i}" aria-label="${t('cancel')}" title="${t('cancel')}">${ICON.close}</button>`
        : `<strong class="sl-grow">${esc(shown)}</strong>
           ${shownOpen ? `<button class="btn btn-sm btn-outline-secondary sl-mini" data-rn="${i}" aria-label="${t('rename')}" title="${t('rename')}">${ICON.edit}</button>` : ''}
           ${!shownOpen && Number(watts) > 0 ? `<span class="sl-muted" dir="ltr">${esc(watts)} W</span>` : ''}
           ${dev.enabled === false ? `<span class="sl-pill">${t('devOff')}</span>` : ''}${state}`;
      // Only the arrow at the row's edge opens or closes it: the rest of the row is safe to scroll over.

      const html = `<div class="sl-dev${shownOpen ? ' sl-open' : ''}"><div class="sl-dev-head">${title}${arrow}</div>
        ${shownOpen ? `<div class="sl-muted" dir="ltr" style="text-align:start">${address}</div>
        ${moved ? `<div class="sl-pill sl-ok">${t('followed')} <span dir="ltr">${esc(dev.host)} → ${esc(snap.host)}</span></div>` : ''}<div class="sl-muted">${energy}</div>${snap?.commandMs != null ? `<div class="sl-muted">${t('commandMs')}: <span dir="ltr">${snap.commandMs} ms</span> · ${snap.engine === 'javascript' ? 'JavaScript' : 'Python'}</div>` : ''}${snap?.readMs != null ? `<div class="sl-muted">${t('readMs')}: <span dir="ltr">${snap.readMs} ms</span> · ${snap.pushes > 0 ? t('pushOn') : t('pushOff')}</div>` : ''}
        <div class="sl-acts">
          <button class="btn btn-sm ${open ? 'btn-primary' : 'btn-outline-primary'}" data-cfg="${i}" aria-expanded="${open}">${ICON.gear}<span>${t('options')}</span></button>
          <button class="btn btn-sm btn-outline-secondary" data-ip="${i}">${ICON.address}<span>${t('changeIp')}</span></button>
          <button class="btn btn-sm btn-outline-secondary" data-diag="${i}" ${snap?.described || dev.type === 'tv' ? '' : 'disabled'}>${ICON.download}<span>${t('diagnostics')}</span></button>

        ${open ? '<div class="sl-inline" id="sl-inline"></div>' : ''}</div>`;
      return { html, section: sectionOf(dev, snap), online: dev.type === 'tv' ? null : Boolean(snap?.online), busy: open || renaming === key };
    });
    // One group per kind of appliance, in a fixed order; a group exists only while it has a device.
    const folded = foldedSections();

      const mine = cards.filter((c) => c.section === sec);

      const known = mine.filter((c) => c.online !== null);

        ${shut ? '' : `<div class="sl-sec-body">${mine.map((c) => c.html).join('')}</div>`}</div>`;
    }).join('');
    dirty = null; // drawing the list again draws the options from what is saved
    box.querySelectorAll('[data-exp]').forEach((b) => b.addEventListener('click', () => {
      const key = keyOf(config.devices[Number(b.dataset.exp)]);
      if (b.getAttribute('aria-expanded') === 'true') {
        expanded.delete(key);

      try { localStorage.setItem('sl-folded', JSON.stringify(now)); } catch { /* the choice lasts for this visit only */ }

    const saveName = async (i) => {

    $('sl-rename')?.addEventListener('keydown', (e) => {

    box.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', async () => {

    box.querySelectorAll('[data-en]').forEach((b) => b.addEventListener('change', async () => {

      await change(() => { const dev = config.devices.find((x) => keyOf(x) === key); if (dev) { dev.enabled = b.checked; } });
    }));
    box.querySelectorAll('[data-cfg]').forEach((b) => b.addEventListener('click', () => {
      const dev = config.devices[Number(b.dataset.cfg)];
      const snap = status.devices.find((x) => x.deviceId && x.deviceId === dev.id) || status.devices.find((x) => x.host === dev.host);

    box.querySelectorAll('[data-diag]').forEach((b) => b.addEventListener('click', () => {
      const dev = config.devices[Number(b.dataset.diag)];
      downloadDiagnostics({ deviceId: dev.id, host: dev.host });
    }));
  }

  // A short checklist that shows what is done and what to do next.
  // A new installation must pick its engine knowingly; one that already has appliances keeps the engine it runs on.
  const engineChosen = () => Boolean(config.engine) || config.devices.length > 0;
  function renderBadges() {
    const mine = config.devices.filter((d) => d.type !== 'tv' && d.enabled !== false);
    const connected = mine.filter((d) => (status.devices.find((x) => x.deviceId && x.deviceId === d.id) || status.devices.find((x) => x.host === d.host))?.online).length;
    const pills = [`<span class="sl-pill sl-ok">✓ ${t('badgeVerified')}</span>`];
    pluginVersion = status.version || '';
    if (status.version) { pills.push(`<span class="sl-pill">${t('badgeVersion')} <span dir="ltr">${esc(status.version)}</span></span>`); }
    if (engineChosen() && status.engine) { pills.push(`<span class="sl-pill">${t('badgeEngine')}: ${status.engine === 'javascript' ? 'JavaScript' : 'Python'}</span>`); }
    if (mine.length) { pills.push(`<span class="sl-pill ${connected === mine.length ? 'sl-ok' : 'sl-warn'}"><span dir="ltr">${connected}</span> ${t('badgeOf')} <span dir="ltr">${mine.length}</span> ${t('badgeConnected')}</span>`); }
    $('sl-badges').innerHTML = pills.join('');
  }
  function renderSteps() {
    const done = [engineChosen() && Boolean(status.runtimeReady), config.devices.length > 0, Boolean(config._bridge)];
    const next = done.indexOf(false);
    const steps = [1, 2, 3, 4].map((n, i) => {
      const isDone = i < 3 && done[i];
      const isNow = i === next || (i === 3 && next === -1);
      const tag = isDone ? `<span class="sl-pill sl-ok">${t('stepDone')}</span>` : isNow && i < 3 ? `<span class="sl-pill sl-warn">${t('stepNow')}</span>` : '';
      return `<div class="sl-step ${isDone ? 'done' : ''} ${isNow ? 'now' : ''}"><div class="sl-num">${isDone ? '✓' : n}</div>
        <div><div class="sl-step-title">${t('step' + n)} ${tag}</div><div class="sl-step-text sl-muted">${t('step' + n + 'Text')}</div></div></div>`;
    }).join('');
    const body = `${steps}<div class="sl-muted mt-1">${t('stepsOrder')}</div>`;
    // The two last steps again under the appliance list, where the owner is once something is added: no way back up.
    const tail = $('sl-next');
    tail.hidden = !(config.devices.length > 0 && next !== -1);
    tail.innerHTML = `<h6>${t('nextTitle')}</h6>${[3, 4].map((n) => `<div class="sl-step ${done[n - 1] ? 'done' : ''}"><div class="sl-num">${done[n - 1] ? '✓' : n}</div>
      <div><div class="sl-step-title">${t('step' + n)}</div><div class="sl-step-text sl-muted">${t('step' + n + 'Text')}</div></div></div>`).join('')}`;
    // Once everything detectable is done the guide folds away, still one tap from view.
    $('sl-steps').innerHTML = next === -1
      ? `<details><summary><strong>${t('stepsDone')}</strong> <span class="sl-pill sl-ok">✓</span></summary><div class="mt-2">${body}</div></details>`
      : `<h6>${t('stepsTitle')}</h6>${body}`;
  }

  function renderRuntime() {
    const box = $('sl-runtime');
    const py = status.python ? `${t('pythonFound')}: <span dir="ltr">${esc(status.python.version)} · ${esc(status.arch)}</span>` : `${t('pythonProblem')}: ${esc(T[lang]['err_' + status.pythonError?.code] ?? status.pythonError?.message ?? '')}`;
    const chosen = engineChosen();
    $('sl-engine-need').style.display = chosen ? 'none' : '';
    $('sl-discover').disabled = !chosen;
    box.style.display = chosen ? '' : 'none';
    box.innerHTML = !chosen ? '' : status.engine === 'javascript'
      ? `<span class="sl-pill sl-ok">${t('engineJsReady')}</span>${status.pythonRuntimeMb > 0
        ? `<div class="sl-muted mt-1">${t('pyLeft')} <span dir="ltr">${status.pythonRuntimeMb} MB</span>. ${t('pyLeftNote')}</div>
           <button class="btn btn-sm btn-outline-danger mt-1" id="sl-py-remove">${t('pyRemove')}</button>` : ''}`
      : status.runtimeReady
      ? `<span class="sl-pill sl-ok">${t('runtimeReady')}</span> <span class="sl-muted">${py}</span>`
      : `<span class="sl-pill sl-warn">${t('runtimeMissing')}</span> <span class="sl-muted">${py}</span>
         <div class="sl-muted mt-1">${t('runtimeNote')}</div>
         <button class="btn btn-sm btn-primary mt-1" id="sl-prepare" ${status.python ? '' : 'disabled'}>${t('runtimePrepare')}</button>`;
    $('sl-py-remove')?.addEventListener('click', async () => {
      homebridge.showSpinner();
      try { const r = await homebridge.request('/remove-runtime'); homebridge.toast.success(`${t('pyRemoved')} ${r.freedMb} MB`); await refreshStatus(); } catch (err) { homebridge.toast.error(errorText(err)); } finally { homebridge.hideSpinner(); }
    });
    $('sl-prepare')?.addEventListener('click', async () => {
      homebridge.showSpinner(); box.querySelector('.sl-muted.mt-1').textContent = t('runtimePreparing');
      try { await homebridge.request('/prepare'); await refreshStatus(); } catch (err) { homebridge.toast.error(errorText(err)); } finally { homebridge.hideSpinner(); }
    });
  }

  function render() {
    const root = $('sl-root');
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    root.lang = lang;
    root.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('sl-lang').textContent = t('langButton');
    $('sl-wipe-list').innerHTML = ['wipe1', 'wipe2', 'wipe3'].map((k) => `<li>${t(k)}</li>`).join('');
    renderBadges();
    renderSteps();
    // A value saved below the minimum (older versions allowed 2) is shown as 4 and stored with the next save.
    const savedPoll = Number(config.pollInterval);
    const below = Number.isFinite(savedPoll) && savedPoll > 0 && savedPoll < 4;
    if (below) { config.pollInterval = 4; }
    $('sl-poll').value = config.pollInterval ?? 5;
    if (below || pollWasBelow) { pollWasBelow ??= savedPoll; $('sl-poll-floor').textContent = t('pollFloor').replace('{v}', pollWasBelow); }
    $('sl-poll-floor').hidden = !(below || pollWasBelow);
    $('sl-push').checked = config.pushUpdates !== false;
    $('sl-follow').checked = config.followAddress !== false;
    $('sl-engine').value = config.engine ?? (config.devices.length ? (status.engine ?? 'python') : '');
    renderRuntime(); renderDevices(); renderResult(); renderScan(); renderStBox(); renderStOpen();
  }

  $('sl-devices').addEventListener('input', markDirty);
  $('sl-devices').addEventListener('change', markDirty);

  async function refreshStatus() {
    try { status = await homebridge.request('/status'); } catch { /* keep the previous status */ }
    render();
  }

  $('sl-lang').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('sl-lang', lang); render(); });
  $('sl-poll').addEventListener('change', async (e) => { const v = Math.min(300, Math.max(4, Number(e.target.value) || 5)); e.target.value = v; pollWasBelow = null; await change(() => { config.pollInterval = v; }, false); render(); });
  $('sl-engine').addEventListener('change', async (e) => { const v = e.target.value; if (!v) { return; } await change(() => { config.engine = v; }, false); await refreshStatus(); });
  $('sl-follow').addEventListener('change', async (e) => { const v = e.target.checked; await change(() => { config.followAddress = v; }, false); });
  $('sl-push').addEventListener('change', async (e) => { const v = e.target.checked; await change(() => { config.pushUpdates = v; }, false); });
  $('sl-scan-btn').addEventListener('click', startScan);
  $('sl-scan').addEventListener('click', (e) => { if (e.target.closest('[data-stop]') && scan) { scan.stop = true; renderProgress(); } });
  $('sl-st-go').addEventListener('click', stImportNow);
  // Reached by a link from this page, the tokens page of SmartThings ended in Samsung's error page (403) on a real
  // iPhone and iPad once the browser was signed in to Samsung, also through SmartThings' own guide; the same address
  // opened when pasted, or when another app handed it to Safari. So on an iPhone or iPad the tap hands the address
  // to the system, which opens it in Safari as if typed. The hand-over is made by a link placed for a moment in the
  // Homebridge page itself: the settings frame is sandboxed and may not start it. If the system does not take it,
  // the button turns into the way through SmartThings' own guide, which is also the way on every other device.
  const GUIDE = 'https://developer.smartthings.com/docs/getting-started/authorization-and-permissions#personal-access-tokens';
  const TOKENS = 'https://account.smartthings.com/tokens';
  const appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let stSystem = appleTouch; // false once the system did not take the address
  /** Follow an address from the Homebridge page itself; false when that page cannot be reached. */
  function followOutside(href, newTab) {
    try {
      const doc = window.top !== window ? window.top.document : null;
      if (!doc?.body) { return false; }
      const a = doc.createElement('a');
      a.href = href; a.style.display = 'none';
      if (newTab) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      doc.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    } catch { return false; }
  }
  function renderStOpen() {
    const a = $('sl-st-open');
    a.href = stSystem ? TOKENS : GUIDE;
    a.textContent = t(stSystem ? 'stOpenDirect' : 'stOpen');
    $('sl-st-guide').hidden = stSystem;
  }
  $('sl-st-open').addEventListener('click', (e) => {
    const note = (how) => { $('sl-st-via').textContent = t('stVia') + ' ' + how; };
    if (stSystem) {
      e.preventDefault();
      const outside = followOutside(TOKENS.replace(/^https:/, 'x-safari-https:'), false);
      if (!outside) { window.location.href = TOKENS.replace(/^https:/, 'x-safari-https:'); }
      note(outside ? 'system · outer' : 'system · frame');
      // Still in front after a moment: the system did not take it. The button becomes the way through the guide.
      setTimeout(() => {
        if (document.visibilityState !== 'visible') { return; }
        stSystem = false; renderStOpen(); note('system refused');
      }, 1800);
      return;
    }
    if (followOutside(GUIDE, true)) { e.preventDefault(); note('guide · outer'); } else { note('guide · frame'); }
  });
  $('sl-st-copy').addEventListener('click', async () => {
    const url = $('sl-st-url').textContent;
    try { await navigator.clipboard.writeText(url); } catch {
      const r = document.createRange(); r.selectNodeContents($('sl-st-url')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); // selected, to copy by hand
      try { document.execCommand('copy'); } catch { return; }
    }
    $('sl-st-copy').textContent = t('stCopied');
    setTimeout(() => { $('sl-st-copy').textContent = t('stCopy'); }, 1500);
  });
  $('sl-st-token').addEventListener('keydown', (e) => { if (e.key === 'Enter') { stImportNow(); } });
  $('sl-discover').addEventListener('click', async () => {
    const host = $('sl-host').value.trim();
    if (!host) { return; }
    if (openKey) { openKey = null; lastProbe = null; renderDevices(); }
    homebridge.showSpinner(); $('sl-result').innerHTML = `<span class="sl-muted">${t('discovering')}</span>`;
    try {
      lastProbe = await homebridge.request('/probe', { host });
      // Same appliance on a new address: keep one entry, never a duplicate.
      const moved = config.devices.find((x) => x.id && x.id === lastProbe.deviceId && x.host !== lastProbe.host);
      if (moved) {
        await change(() => { const dev = config.devices.find((x) => x.id === lastProbe.deviceId); if (dev) { dev.host = lastProbe.host; } }, false);
        homebridge.toast.info(t('sameDevice'));
      }
      await refreshStatus();
    } catch (err) {
      lastProbe = null;
      const tech = err?.error?.technical;
      const code = err?.error?.code ?? err?.code ?? 'error';
      const techHtml = `<details class="mt-2" open><summary>${t('techDetails')}</summary><pre dir="ltr" style="white-space:pre-wrap;font-size:.78rem;margin:6px 0 0">${esc(JSON.stringify({ code, ...(tech || { raw: err?.message }) }, null, 1))}</pre></details>`;
      $('sl-result').innerHTML = `<div class="alert alert-danger mb-0">${esc(errorText(err))}${techHtml}</div>`;
    } finally { homebridge.hideSpinner(); }
  });
  $('sl-wipe').addEventListener('click', async () => {
    if ($('sl-wipe-confirm').value.trim() !== 'DELETE') { homebridge.toast.warning(t('wipeType')); return; }
    try {
      const res = await homebridge.request('/wipe', { confirm: 'DELETE' });
      homebridge.toast.success(res.removed.length ? t('wipeDone') + res.removed.join(', ') : t('wipeNothing'));
      $('sl-wipe-confirm').value = ''; lastProbe = null; await refreshStatus();
    } catch (err) { homebridge.toast.error(errorText(err)); }
  });

  try { legacyNames = (await homebridge.request('/legacy-devices')).names; } catch { legacyNames = []; }
  try { ({ remembered, legacyById } = await homebridge.request('/names')); } catch { remembered = {}; legacyById = {}; }
  try { stImport = (await homebridge.request('/smartthings-saved')) || null; } catch { stImport = null; }
  await refreshStatus();
})();
</script>
