# Run by hand, from the Actions tab: tidies the trial versions of finished lines.
#
# - GitHub: removes the release pages of a finished trial line, keeping its newest three. The
#   lines are 1.4.0-beta.N (finished by 1.5.0) and 1.5.1-beta.N with 1.6.0-beta.N, taken as one
#   line (finished by 1.6.0). Tags are kept, so every version stays in the history; only the
#   long list on the Releases page gets shorter.
# - npm: the trial versions of finished lines are marked as superseded, with a pointer to the
#   full release. Nothing is removed: npm asks the owner's one-time code for that.
# - The first versions of the project (0.x, including 0.0.0-stage, 0.1.0-beta.2 and
#   0.1.0-beta.3) are never touched: they are its foundation.
#
# "preview" only lists what would be done. "apply" does it; removed release pages do not come back.
# Requires the repository secret NPM_TOKEN, as the Release workflow does.
name: Tidy old trial versions
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview lists what would be done; apply does it'
        type: choice
        options: [preview, apply]
        default: preview
      keep:
        description: 'How many of the newest trial release pages to keep in each finished line'
        default: '3'
jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      KEEP: ${{ inputs.keep }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release pages of the finished trial lines
        run: |
          case "$KEEP" in ''|*[!0-9]*) echo "keep must be a number" >&2; exit 1 ;; esac
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.prerelease) | .tag_name' > pre.txt
          : > remove.txt
          for line in '^v1\.4\.0-beta\.[0-9]+$' '^v1\.(5\.1|6\.0)-beta\.[0-9]+$'; do
            grep -E "$line" pre.txt | sort -V -r > all.txt || true
            echo "Line $line: $(wc -l < all.txt) trial release pages"
            echo "  Kept:"; head -n "$KEEP" all.txt | sed 's/^/    /'
            tail -n +"$((KEEP + 1))" all.txt >> remove.txt
          done
          grep -E '^v0\.' remove.txt && { echo "a 0.x version is never removed" >&2; exit 1; }
          echo "To remove ($(wc -l < remove.txt)):"; cat remove.txt
          if [ "$MODE" != "apply" ]; then echo "Preview only: nothing was removed."; exit 0; fi
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes   # the tag itself stays
            echo "removed the release page of $tag"
          done < remove.txt
      - name: Mark the trial versions of finished lines on npm as superseded
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Removing a version from npm needs the owner's one-time code, which a workflow never
          # has. The owner can remove them by hand; here they are marked, with a pointer.
          mark() {   # range, note
            range=$1; note=$2
            newest=$(npm view "homebridge-samsung-local@$range" version --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log([].concat(v).pop())')
            if [ "$(npm view "homebridge-samsung-local@$newest" deprecated)" = "$note" ]; then
              echo "$range: already marked."; return   # npm refuses to set the same note twice
            fi
            if [ "$MODE" != "apply" ]; then echo "Preview only: would mark $range"; return; fi
            npm deprecate "homebridge-samsung-local@$range" "$note"
            echo "$range: marked."
          }
          old='Trial version of a finished line. Use the full release (1.5.0 or later).'
          mark '>=1.1.0-beta.1 <1.1.0' "$old"
          mark '>=1.4.0-beta.1 <1.4.0' "$old"
          new='Trial version of a finished line. Use the full release (1.6.0 or later).'
          mark '>=1.5.1-beta.1 <1.5.1' "$new"
          mark '>=1.6.0-beta.1 <1.6.0' "$new"
