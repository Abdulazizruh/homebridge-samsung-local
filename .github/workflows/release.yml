# Publishes to npm when a GitHub release is published.
# Full releases go to "latest"; pre-releases go to "beta" once a stable version exists.
# Requires the repository secret NPM_TOKEN (an npm automation token).
name: Release
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test
      # Nothing is published unless the Python helper passes its tests too.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "pip install --only-binary :all: --require-hashes -r python/requirements.lock"
      - run: python -m unittest discover -s test/python -v
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # The channel follows the kind of release and nothing else: a pre-release goes to "beta", a full
      # release to "latest". It never depends on a question to the registry, which could fail and send
      # a trial version to everyone. A version number and a release kind that disagree stop the job.
      - name: Choose npm tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in *-*) trial=true ;; *) trial=false ;; esac
          if [ "$trial" != "${{ github.event.release.prerelease }}" ]; then
            echo "Version $version and the release's pre-release tick disagree: nothing is published." >&2
            exit 1
          fi
          if [ "$trial" = "true" ]; then echo "tag=beta" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi
      - run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
