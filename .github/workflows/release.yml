# Publishes to npm when a GitHub release is published.
# Full releases go to "latest"; pre-releases go to "beta" once a stable version exists.
# Requires the repository secret NPM_TOKEN (an npm automation token).
name: Release
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test
      # Nothing is published unless the Python helper passes its tests too.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "pip install --only-binary :all: --require-hashes -r python/requirements.lock"
      - run: python -m unittest discover -s test/python -v
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      # A pre-release goes to the "beta" tag once a stable version exists.
      # Until then it is also "latest", so the Homebridge plugin search can
      # find and install the package.
      - name: Choose npm tag
        id: tag
        run: |
          current="$(npm view homebridge-samsung-local dist-tags.latest 2>/dev/null || true)"
          if [ "${{ github.event.release.prerelease }}" = "true" ] && [ -n "$current" ] && [ "${current#*-}" = "$current" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
